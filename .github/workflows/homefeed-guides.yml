name: 홈판 벤치마크 작성 안내

# 2026-10-10 사장님 "전부 다 붙이고 싶다 — 12장만이 아니라, 확인하는 사람이 있거든".
# 판 수집(홈판 벤치마크 발행)이 끝날 때마다 이어서 돌아, 안내가 없는 카드를 전부 구독 AI(Sonnet)로 짓는다.
# 회차마다 새 카드 228~501장(실측) — 판 수집 30분 안에서는 못 지어서 따로 뺐다.
# 결과는 자기 파일(spa/public/data/homefeed-benchmark-guides.json)에만 쓴다. 판 파일을 두 작업이 같이 고치면
# 판 발행의 rebase 가 충돌로 멈춘다. 사이트가 판과 합친다(카드 id → 없으면 원문 주소).
# 코덱스는 쓰지 않는다 — 레포가 공개라 구독 로그인 파일(auth.json)을 CI 에 두지 말라는 공식 안내.

on:
  workflow_run:
    workflows: ['홈판 벤치마크 발행']
    types: [completed]
  workflow_dispatch:
    inputs:
      max:
        description: '이번 실행에서 새로 안내를 지을 카드 수 상한'
        default: '1000'

permissions:
  contents: read

concurrency:
  group: homefeed-guides
  cancel-in-progress: false

jobs:
  guides:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    # 생성 40분 상한 + 진행 중 배치(최대 3분) + 준비(npm ci 등) — 처음 1,000장은 1~2회차에 걸쳐 채운다.
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # --ignore-scripts 금지: 엔진(agent-cli)이 electron 을 import 한다(homefeed-benchmarks.yml 과 같은 이유).
      - name: npm ci (행업 방어)
        run: |
          for i in 1 2 3; do
            timeout 600 npm ci && exit 0
            echo "npm ci 실패 또는 10분 초과 — 재시도 $i/3"
          done
          exit 1
      - name: Test guide store rules
        run: node --test scripts/enrich-benchmark-guides.test.cjs
      - name: 구독 CLI 폴백 준비
        uses: ./.github/actions/setup-subscription-agents
      - name: Checkout website
        uses: actions/checkout@v4
        with:
          repository: cd000242-sudo/naver
          ssh-key: ${{ secrets.SITE_REPO_SSH_KEY }}
          path: site
      - name: 카드별 작성 안내 생성
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: >-
          node scripts/enrich-benchmark-guides.js
          --board=site/spa/public/data/homefeed-benchmarks.json
          --store=site/spa/public/data/homefeed-benchmark-guides.json
          --max=${{ inputs.max || '1000' }}
          --concurrency=6
          --budget-min=40
      - name: Publish only the guide store
        working-directory: site
        run: |
          git config user.name 'leword-bot'
          git config user.email 'bot@leaderspro.kr'
          git add spa/public/data/homefeed-benchmark-guides.json
          if git diff --cached --quiet; then
            echo 'No guide changes.'
            exit 0
          fi
          git commit -m "chore(homefeed): refresh benchmark writing guides"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then
              echo '::error::Concurrent guide change requires review.'
              exit 1
            fi
            sleep 10
          done
          echo '::error::Guide publication failed.'
          exit 1
