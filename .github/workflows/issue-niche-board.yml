name: 실검 틈새 보드 발굴 (하루 3회)

# 실시간 이슈는 하루면 문서가 쌓여 자리가 닫힌다 — 그래서 하루 3회다.
#
# 시간대 함정: cron 은 UTC 다. 한국 07:00 / 13:00 / 19:00 은 UTC 22:00(전날) /
# 04:00 / 10:00 이다.
#
# 회차 비용(11차 라이브 실측): 구독 에이전트 1회(이슈 전부를 한 프롬프트에
# 묶는다) · 데이터랩 ≈26회 · 블로그 검색 ≈100회 · 뉴스/자동완성/연관어 이슈당
# 각 1회. 하루 3회면 데이터랩 1,000 한도의 8% — 유료 API 는 없다.
# 황금키워드보드와 같은 방식이다: 사장님 CI 가 돌리고 정적 JSON 을 사이트
# 레포에 발행하며, 방문자는 보기만 한다.
#
# 회차 = 발굴(헌터) → 자리 실측(Bright Data, 회차당 12건) → 황금 보강(enrich-board.js,
# 황금키워드보드와 같은 보강기: 지식인·연관 실측 풀·서브키워드·AI 제목·30일 추세·수익
# 판정) → 발행. 보강은 실패해도 회차를 죽이지 않는다 — 실측 행만으로 발행한다.
#
# 틈새 = 트래픽(검색광고 검색량 300+, 수요 상승중이면 100+) · 수요(데이터랩 7일 실측 +
# 문서수 3,000↓) · 자리(블로그탭 상위 10 정면글 0건) 세 실측을 다 통과한 키워드다.
# 자리만 Bright Data(유료 쿼터) 라 회차당 상한 12건 = 하루 36 · 달 ≤1,116 — 무료 5,000
# 안이고 기능 상한 'issue' 1,100 으로 잠근다. 잰 자리는 48시간 캐시로 다시 안 센다.
on:
  schedule:
    - cron: '0 22,4,10 * * *'
  workflow_dispatch:
    inputs:
      issueLimit:
        description: 실시간 이슈 상한
        default: '16'
      maxCandidates:
        description: 후보 상한
        default: '240'
      maxAi:
        description: 황금 보강 AI 호출 상한(행 단위)
        default: '40'
      maxAiCarried:
        description: 이월 행 재보강 AI 호출 상한(행 단위)
        default: '30'
      maxSlots:
        description: 자리 실측(Bright Data) 회차당 상한 — 0 이면 캐시·판정만
        default: '20'

concurrency:
  group: issue-niche-board
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    # 로컬 실측 11차: 이슈 16 → 후보 61 에 약 6분. 황금 보강이 행당 AI 1콜(동시 3)이라
    # 30~40행이면 15분 안팎. 보강 스텝은 따로 25분 제한이 있다.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # npm ci 가 러너에서 걸린 전력이 있다(선점 보드) — 10분 제한 + 3회 재시도.
      - name: npm ci (행업 방어)
        run: |
          for i in 1 2 3; do
            timeout 600 npm ci && exit 0
            echo "npm ci 실패 또는 10분 초과 — 재시도 $i/3"
          done
          exit 1

      # 발행용 키가 없으면 회차 끝에서 죽는다. 돌리기 전에 본다.
      # 구독 토큰은 필수가 아니다 — 없으면 이슈 추론(왜·다음 물결)과 황금 보강이
      # 빠지고 실측 재료(자동완성·연관어)만으로 간다. 얕은 회차라 경고를 남긴다.
      - name: 필수 시크릿 확인
        env:
          REQUIRED: |
            NAVER_CLIENT_ID=${{ secrets.NAVER_CLIENT_ID != '' }}
            NAVER_CLIENT_SECRET=${{ secrets.NAVER_CLIENT_SECRET != '' }}
            NAVER_SEARCH_AD_ACCESS_LICENSE=${{ secrets.NAVER_SEARCH_AD_ACCESS_LICENSE != '' }}
            NAVER_SEARCH_AD_SECRET_KEY=${{ secrets.NAVER_SEARCH_AD_SECRET_KEY != '' }}
            SITE_REPO_SSH_KEY=${{ secrets.SITE_REPO_SSH_KEY != '' }}
          HAS_CLAUDE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
          HAS_BRIGHTDATA: ${{ secrets.BRIGHTDATA_TOKEN != '' }}
        run: |
          missing=0
          while IFS='=' read -r name present; do
            [ -z "$name" ] && continue
            if [ "$present" != 'true' ]; then
              echo "::error::시크릿 없음 — $name"
              missing=1
            fi
          done <<< "$REQUIRED"
          if [ "$missing" -eq 1 ]; then
            echo '회차를 돌리기 전에 멈춘다. 저장소 Settings → Secrets 에서 채울 것.'
            exit 1
          fi
          if [ "$HAS_CLAUDE" != 'true' ]; then
            echo '::warning::CLAUDE_CODE_OAUTH_TOKEN 없음 — 이슈 추론·황금 보강 없이 실측 재료만으로 간다(얕은 회차).'
          fi
          if [ "$HAS_BRIGHTDATA" != 'true' ]; then
            echo '::warning::BRIGHTDATA_TOKEN 없음 — 자리(블로그탭 상위 10)를 못 재니 이번 회차 틈새는 0 이고 대기 행은 발행되지 않는다.'
          fi
          echo '필수 시크릿 확인됨.'

      # 구독 에이전트 CLI. API 키가 아니라 사장님 구독 토큰으로 돈다 — 건당 비용이 없다.
      - name: 구독 에이전트 CLI 설치
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo '구독 토큰 없음 — CLI 설치를 건너뛴다.'
            exit 0
          fi
          npm install -g @anthropic-ai/claude-code

      - name: 실검 틈새 회차
        env:
          # EnvironmentManager 가 읽는 이름 그대로다. issue-niche-board-workflow.test.ts 가 대조한다.
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          # 검색량은 검색광고 API 에서만 온다 — 이 셋이 빠지면 보드 전 행의 검색량이 null 이다(첫 발행이 그랬다).
          NAVER_SEARCH_AD_ACCESS_LICENSE: ${{ secrets.NAVER_SEARCH_AD_ACCESS_LICENSE }}
          NAVER_SEARCH_AD_SECRET_KEY: ${{ secrets.NAVER_SEARCH_AD_SECRET_KEY }}
          NAVER_SEARCH_AD_CUSTOMER_ID: ${{ secrets.NAVER_SEARCH_AD_CUSTOMER_ID }}
          # API HUB 시크릿 등록 전엔 빈 값 → 어댑터가 legacy 로 동작(무해)
          NAVER_APIHUB_KEY_ID: ${{ secrets.NAVER_APIHUB_KEY_ID }}
          NAVER_APIHUB_KEY: ${{ secrets.NAVER_APIHUB_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          node scripts/issue-niche-board.js \
            --out=issue-board.json \
            --picksOut=issue-board-picks.json \
            --issueLimit=${{ github.event.inputs.issueLimit || '16' }} \
            --maxCandidates=${{ github.event.inputs.maxCandidates || '240' }}

      # 개인 토큰(PAT) 대신 배포키 — 이 레포 하나에만 붙고 만료가 없다.
      # 자리 실측이 직전 발행본(이월 승격)·자리 캐시·쿼터 장부를 읽으므로 그보다 먼저다.
      - name: 사이트 레포 체크아웃
        uses: actions/checkout@v4
        with:
          repository: cd000242-sudo/naver
          ssh-key: ${{ secrets.SITE_REPO_SSH_KEY }}
          path: site

      # 틈새의 세 번째 게이트 — 블로그탭 상위 10 에 정면 대응 글이 0건인가(serp-winnability).
      # 네이버 HTML 은 Bright Data 로만 받으니 회차당 상한(12건)만큼 검색량 큰 순으로 재고,
      # 못 잰 행은 대기로 남아 발행되지 않는다. 직전 발행본의 선점 후보가 재측정으로 검색량
      # 하한을 넘겼으면 여기서 같이 재어 틈새로 승격한다. AI 호출 없음.
      # 쿼터 장부·캐시는 사이트 레포 data/ 에 두고 커밋한다 — 회차마다 새 러너라 파일이 기억이다.
      # 실패해도 회차는 산다 — 대기 행 없이 선점 후보만으로 발행한다.
      - name: 자리 실측(블로그탭 상위 10)
        continue-on-error: true
        timeout-minutes: 15
        env:
          BRIGHTDATA_TOKEN: ${{ secrets.BRIGHTDATA_TOKEN }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
          LEWORD_BRIGHTDATA_QUOTA_STATE_FILE: ${{ github.workspace }}/site/data/brightdata-quota-issue.json
          # 달 1,100 건에서 기능 자체를 잠근다(12 × 3 × 31 = 1,116 이 이론 최대 — 캐시 재사용으로 실제는 더 적다).
          LEWORD_BRIGHTDATA_FEATURE_CAPS: '{"issue":2000}'
        run: |
          if [ ! -s issue-board.json ]; then
            echo '원장 없음 — 건너뛴다.'
            exit 0
          fi
          mkdir -p site/data
          node scripts/serp-slot-issue-board.js \
            --in=issue-board.json \
            --prev=site/spa/public/data/issue-niche-board.json \
            --cache=site/data/issue-slot-cache.json \
            --ledgerOut=issue-board-slotted.json \
            --picksOut=issue-board-picks-slotted.json \
            --max=${{ github.event.inputs.maxSlots || '20' }}
          # JSON 이 온전할 때만 원장·발행 입력에 덮는다.
          node -e "JSON.parse(require('fs').readFileSync('issue-board-slotted.json','utf8'))" \
            && cp issue-board-slotted.json issue-board.json
          node -e "JSON.parse(require('fs').readFileSync('issue-board-picks-slotted.json','utf8'))" \
            && cp issue-board-picks-slotted.json issue-board-picks.json

      # 황금키워드보드와 **같은 보강기**를 틈새·선점 행에 돌린다(사장님 지시 2026-09-03
      # "황금키워드랑 똑같이 버튼·연관키워드·그래프 전부"). 행마다 체크포인트 저장이라
      # 시간에 잘려도 부분본이 남는다. 실패해도 회차는 산다 — 실측 행만으로 발행한다.
      - name: 황금 보강 (지식인·연관 풀·제목·추세·수익)
        continue-on-error: true
        timeout-minutes: 25
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          NAVER_SEARCH_AD_ACCESS_LICENSE: ${{ secrets.NAVER_SEARCH_AD_ACCESS_LICENSE }}
          NAVER_SEARCH_AD_SECRET_KEY: ${{ secrets.NAVER_SEARCH_AD_SECRET_KEY }}
          NAVER_SEARCH_AD_CUSTOMER_ID: ${{ secrets.NAVER_SEARCH_AD_CUSTOMER_ID }}
          NAVER_APIHUB_KEY_ID: ${{ secrets.NAVER_APIHUB_KEY_ID }}
          NAVER_APIHUB_KEY: ${{ secrets.NAVER_APIHUB_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ ! -s issue-board-picks.json ]; then
            echo '보강 대상 파일 없음 — 건너뛴다.'
            exit 0
          fi
          node scripts/enrich-board.js \
            --in=issue-board-picks.json \
            --out=issue-board-enriched.json \
            --maxAi=${{ github.event.inputs.maxAi || '40' }}

      # 보강본이 있으면 그것을, 없으면(보강 실패·토큰 없음) 실측 행만 발행한다.
      - name: 발행 입력 고르기
        run: |
          if [ -s issue-board-enriched.json ]; then
            cp issue-board-enriched.json issue-board-publish.json
            echo '보강본 발행.'
          elif [ -s issue-board-picks.json ]; then
            cp issue-board-picks.json issue-board-publish.json
            echo '::warning::황금 보강 산출물 없음 — 실측 행만 발행한다.'
          else
            cp issue-board.json issue-board-publish.json
            echo '::warning::보강 대상 파일 없음 — 원장 그대로 발행한다.'
          fi

      # 원장(탈락 행 포함)·보강 대상·보강본을 남긴다 — 게이트를 조일지 풀지 정할 근거다.
      - name: 보드 원장 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-niche-board-raw
          path: |
            issue-board.json
            issue-board-picks.json
            issue-board-enriched.json
            issue-board-slotted.json
          retention-days: 7
          if-no-files-found: warn

      # 실을 행이 0 이면 발행기가 기존 파일을 그대로 둔다(exit 4). 회차는 살린다.
      - name: 보드 발행
        run: |
          node scripts/publish-issue-niche-board.js \
            --in=issue-board-publish.json \
            --dest=site/spa/public/data/issue-niche-board.json || [ $? -eq 4 ]

      # 이월 행의 검색량·추세를 다시 잰다 — 갓 태어난 이슈 키워드는 첫 회차에 키워드도구가
      # 몰라(null) 48시간 내내 '—' 였고, 데이터랩이 첫날 0~1점을 주면 그래프가 영영 없었다
      # (실사고 2026-09-03 '지예은 남편': 도구가 알게 된 뒤에도 화면은 '—'). 실측 API 둘뿐,
      # AI 호출 없음. 판정은 안 건드린다. 재보강보다 먼저 — 재보강은 그래프 있는 행을 건너뛴다.
      - name: 이월 행 재측정(검색량·추세)
        continue-on-error: true
        timeout-minutes: 10
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          NAVER_SEARCH_AD_ACCESS_LICENSE: ${{ secrets.NAVER_SEARCH_AD_ACCESS_LICENSE }}
          NAVER_SEARCH_AD_SECRET_KEY: ${{ secrets.NAVER_SEARCH_AD_SECRET_KEY }}
          NAVER_SEARCH_AD_CUSTOMER_ID: ${{ secrets.NAVER_SEARCH_AD_CUSTOMER_ID }}
          NAVER_APIHUB_KEY_ID: ${{ secrets.NAVER_APIHUB_KEY_ID }}
          NAVER_APIHUB_KEY: ${{ secrets.NAVER_APIHUB_KEY }}
        run: |
          DEST=site/spa/public/data/issue-niche-board.json
          if [ ! -s "$DEST" ]; then
            echo '발행본 없음 — 건너뛴다.'
            exit 0
          fi
          node scripts/remeasure-issue-board.js \
            --in="$DEST" \
            --out=issue-board-remeasured.json
          # JSON 이 온전할 때만 발행본에 덮는다.
          node -e "JSON.parse(require('fs').readFileSync('issue-board-remeasured.json','utf8'))" \
            && cp issue-board-remeasured.json "$DEST"

      # 이월 행 중 보강이 안 끝난 것을 발행본 위에서 다시 보강한다 — 직전 회차 보강이
      # 실패했거나(continue-on-error) 옛 회차 행이면 맨카드로 48시간 남는다(첫 회차
      # 2026-09-03: 38행 중 28행이 맨카드). 보강기는 완제품 행을 건너뛰고(AI 0) 행을
      # 제자리에서 고치므로 measuredAt·carried·표본은 그대로다. 평소엔 거의 공짜다.
      - name: 이월 행 재보강
        continue-on-error: true
        timeout-minutes: 20
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          NAVER_SEARCH_AD_ACCESS_LICENSE: ${{ secrets.NAVER_SEARCH_AD_ACCESS_LICENSE }}
          NAVER_SEARCH_AD_SECRET_KEY: ${{ secrets.NAVER_SEARCH_AD_SECRET_KEY }}
          NAVER_SEARCH_AD_CUSTOMER_ID: ${{ secrets.NAVER_SEARCH_AD_CUSTOMER_ID }}
          NAVER_APIHUB_KEY_ID: ${{ secrets.NAVER_APIHUB_KEY_ID }}
          NAVER_APIHUB_KEY: ${{ secrets.NAVER_APIHUB_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          DEST=site/spa/public/data/issue-niche-board.json
          if [ ! -s "$DEST" ]; then
            echo '발행본 없음 — 건너뛴다.'
            exit 0
          fi
          bare=$(node -e "const b=require('./$DEST');console.log((b.rows||[]).filter(r=>!(r.titles&&(r.titles.seo||r.titles.home))&&!(r.subKeywords||[]).length&&!(r.keywordPool||[]).length).length)")
          echo "보강 안 끝난 행 $bare개"
          if [ "$bare" = '0' ]; then
            echo '재보강할 행 없음.'
            exit 0
          fi
          node scripts/enrich-board.js \
            --in="$DEST" \
            --out=issue-board-recarried.json \
            --maxAi=${{ github.event.inputs.maxAiCarried || '30' }}
          # 체크포인트 저장이라 잘려도 부분본이 남는다. JSON 이 온전할 때만 발행본에 덮는다.
          node -e "JSON.parse(require('fs').readFileSync('issue-board-recarried.json','utf8'))" \
            && cp issue-board-recarried.json "$DEST"

      - name: 커밋·푸시
        working-directory: site
        run: |
          git config user.name 'leword-bot'
          git config user.email 'bot@leaderspro.kr'
          git add spa/public/data/issue-niche-board.json data/brightdata-quota-issue.json data/issue-slot-cache.json
          if git diff --cached --quiet; then
            echo '변경 없음 — 이번 회차는 실을 키워드가 없고 이월 행도 그대로다.'
            exit 0
          fi
          git commit -m "chore(board): 실검 틈새 보드 갱신 $(date -u '+%Y-%m-%d %H:%M UTC')"
          # 사이트 레포는 15분 크론(공개 스냅샷)이 계속 커밋한다 — 체크아웃이 낡아
          # 밀어내기가 거부되기 쉽다. 제목 창고 회차와 같이 물러섰다 다시.
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "푸시 재시도 $i/3"
            sleep 10
          done
          exit 1
