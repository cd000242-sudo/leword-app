name: 홈판 벤치마크 발행

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: homefeed-benchmarks
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install collector dependencies
        run: npm ci --ignore-scripts
      - name: Test benchmark evidence rules
        run: node --test scripts/homefeed-benchmarks.test.cjs scripts/homefeed-benchmarks-editorial.test.cjs
      - name: Checkout website
        uses: actions/checkout@v4
        with:
          repository: cd000242-sudo/naver
          ssh-key: ${{ secrets.SITE_REPO_SSH_KEY }}
          path: site
      - name: Collect public benchmark posts
        run: >-
          node scripts/homefeed-benchmarks.cjs
          --output site/spa/public/data/homefeed-benchmarks.json
          --state site/data/homefeed-benchmark-state.json
      - name: Publish only the benchmark board and observation state
        working-directory: site
        run: |
          git config user.name 'leword-bot'
          git config user.email 'bot@leaderspro.kr'
          git add spa/public/data/homefeed-benchmarks.json data/homefeed-benchmark-state.json
          if git diff --cached --quiet; then
            echo 'No benchmark changes.'
            exit 0
          fi
          git commit -m "chore(homefeed): refresh benchmark evidence"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then
              echo '::error::Concurrent benchmark change requires review.'
              exit 1
            fi
            sleep 10
          done
          echo '::error::Benchmark publication failed.'
          exit 1
