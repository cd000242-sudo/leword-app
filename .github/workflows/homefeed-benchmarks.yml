name: 홈판 벤치마크 발행

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: homefeed-benchmarks
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # 제목 · 작성 안내 생성은 homefeed-guides.yml 로 옮겼다(2026-10-10) — 여기는 수집 + 창고 제목 부착만.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # --ignore-scripts 금지: 제목 엔진(agent-cli/agentRuntime·usageLedger)이 electron 을 import 해서
      # 바이너리가 없으면 "Electron failed to install correctly" 로 제목 생성이 통째로 죽는다(2026-09-30 첫 회차 실측).
      # 글감 레인(topic-briefs)과 같은 npm ci 패턴.
      - name: npm ci (행업 방어)
        run: |
          for i in 1 2 3; do
            timeout 600 npm ci && exit 0
            echo "npm ci 실패 또는 10분 초과 — 재시도 $i/3"
          done
          exit 1
      - name: Test benchmark evidence rules
        run: node --test scripts/homefeed-benchmarks.test.cjs scripts/homefeed-benchmarks-trends.test.cjs scripts/homefeed-benchmark-ledger.test.cjs scripts/homefeed-benchmarks-editorial.test.cjs scripts/enrich-benchmark-titles.test.cjs scripts/homefeed-instagram.test.cjs
      - name: Checkout website
        uses: actions/checkout@v4
        with:
          repository: cd000242-sudo/naver
          ssh-key: ${{ secrets.SITE_REPO_SSH_KEY }}
          path: site
      # 인스타 5계정은 Bright Data Instagram Scraper API 로 읽는다(레코드 1건 = 1크레딧, 계정 공용 무료 5,000/월).
      # 하루 1회(KST)만 trigger 하고 나머지 회차는 site/data/homefeed-instagram.json 풀을 재사용한다.
      # 장부(brightdata-quota-homefeed.json)는 사이트 레포에 두고 판과 함께 커밋한다 — 회차마다 새 러너라 파일이 기억이다.
      - name: Collect public benchmark posts
        env:
          BRIGHTDATA_TOKEN: ${{ secrets.BRIGHTDATA_TOKEN }}
          LEWORD_BRIGHTDATA_QUOTA_STATE_FILE: ${{ github.workspace }}/site/data/brightdata-quota-homefeed.json
          # 같은 계정을 쓰는 다른 레인의 장부 — 읽기만 한다(상한을 합계로 보기 위해).
          LEWORD_BRIGHTDATA_QUOTA_PEER_FILES: ${{ github.workspace }}/data/brightdata-quota-state.json,${{ github.workspace }}/site/data/brightdata-quota-briefs.json,${{ github.workspace }}/site/data/brightdata-quota-issue.json
          LEWORD_BRIGHTDATA_FREE_CEILING: '5000'
          # 다른 세 레인과 같은 숫자여야 한다(brightdata-budget-invariant.test.ts 가 잠근다).
          LEWORD_BRIGHTDATA_PAID_OVERAGE: '12500'
          # 5계정 × 8건 × 30일 = 1,200 + 여유. 네 레인 합 17,200 ≤ 17,500.
          LEWORD_BRIGHTDATA_FEATURE_CAPS: '{"homefeed":1500}'
          LEWORD_IG_POSTS_PER_ACCOUNT: '8'
        run: >-
          node scripts/homefeed-benchmarks.cjs
          --output site/spa/public/data/homefeed-benchmarks.json
          --state site/data/homefeed-benchmark-state.json
          --instagram site/data/homefeed-instagram.json
          --ledger site/data/homefeed-ledger
      # 제목은 따로 도는 제목 작업(homefeed-guides.yml titles, 2026-10-10 "전부 채워 달라")이 카드 전부를 짓고 창고만 쓴다.
      # 여기서는 창고 제목을 판에 붙이기만 한다(창고를 쓰는 쪽은 하나 — 같이 쓰면 rebase 충돌). 앱(AI 비서 · 오늘의 추천)이 판의 homeTitles 를 읽는다.
      - name: 소재별 홈판 제목 부착(창고 → 판)
        run: >-
          node scripts/enrich-benchmark-titles.js
          --board=site/spa/public/data/homefeed-benchmarks.json
          --store=site/spa/public/data/homefeed-benchmark-titles.json
          --attach-only
      - name: Publish only the benchmark board, title store and observation state
        working-directory: site
        run: |
          git config user.name 'leword-bot'
          git config user.email 'bot@leaderspro.kr'
          git add spa/public/data/homefeed-benchmarks.json spa/public/data/homefeed-benchmark-titles.json data/homefeed-benchmark-state.json
          [ -f data/homefeed-instagram.json ] && git add data/homefeed-instagram.json
          [ -f data/brightdata-quota-homefeed.json ] && git add data/brightdata-quota-homefeed.json
          # 시간 장부 — 새 날짜 파일 추가와 14일 지난 파일 삭제를 함께 싣는다(-A).
          [ -d data/homefeed-ledger ] && git add -A data/homefeed-ledger
          if git diff --cached --quiet; then
            echo 'No benchmark changes.'
            exit 0
          fi
          git commit -m "chore(homefeed): refresh benchmark evidence"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then
              echo '::error::Concurrent benchmark change requires review.'
              exit 1
            fi
            sleep 10
          done
          echo '::error::Benchmark publication failed.'
          exit 1
