name: 미리 써 둘 소재

# 2026-10-11 사장님 "지금 홈판도 미리 쓰면 뜰 소재가 있으면 — A매치 우루과이전에 처음 나온 김민수 선수 글이 그날만 43만".
# 네이버 스포츠 경기 일정 + 기사 속 예정(앞으로 7일) → '처음' 신호(첫 발탁 · 데뷔 · 복귀 · 첫 방송 …) 사람(Sonnet, 기사 인용 검사)
# → 실측(검색량 · 블로그 문서 수 · 자동완성) → 문서 적은 사람 12명에 홈판 제목(Opus) → site/spa/public/data/upcoming-topics.json.
# 한국 07:10 · 17:10 — 아침에 그날 · 다가오는 경기 · 방송을, 저녁에 다음 날 것을 미리 본다. 자기 파일만 쓴다.

on:
  schedule:
    - cron: '10 22 * * *'
    - cron: '10 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upcoming-topics
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # --ignore-scripts 금지: 엔진(agent-cli)이 electron 을 import 한다(homefeed-benchmarks.yml 과 같은 이유).
      - name: npm ci (행업 방어)
        run: |
          for i in 1 2 3; do
            timeout 600 npm ci && exit 0
            echo "npm ci 실패 또는 10분 초과 — 재시도 $i/3"
          done
          exit 1
      - name: 구독 CLI 폴백 준비
        uses: ./.github/actions/setup-subscription-agents
      - name: Checkout website
        uses: actions/checkout@v4
        with:
          repository: cd000242-sudo/naver
          ssh-key: ${{ secrets.SITE_REPO_SSH_KEY }}
          path: site
      - name: 미리 써 둘 소재 판 만들기
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          NAVER_APIHUB_KEY_ID: ${{ secrets.NAVER_APIHUB_KEY_ID }}
          NAVER_APIHUB_KEY: ${{ secrets.NAVER_APIHUB_KEY }}
        run: >-
          node scripts/upcoming-topics.js
          --out=site/spa/public/data/upcoming-topics.json
          --days=7
          --max-events=40
          --concurrency=4
          --budget-min=20
          --titles=12
      - name: Publish only the upcoming topics board
        working-directory: site
        run: |
          git config user.name 'leword-bot'
          git config user.email 'bot@leaderspro.kr'
          git add spa/public/data/upcoming-topics.json
          if git diff --cached --quiet; then
            echo 'No upcoming changes.'
            exit 0
          fi
          git commit -m "chore(upcoming): refresh prewrite topics"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then
              echo '::error::Concurrent upcoming change requires review.'
              exit 1
            fi
            sleep 10
          done
          echo '::error::Upcoming publication failed.'
          exit 1
