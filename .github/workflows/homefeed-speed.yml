name: Refresh Homefeed Speed Check

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: homefeed-speed
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check out website
        uses: actions/checkout@v4
        with:
          repository: cd000242-sudo/naver
          ref: main
          ssh-key: ${{ secrets.SITE_REPO_SSH_KEY }}
          path: site
      - name: Measure recent news and update observations
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          NAVER_APIHUB_KEY_ID: ${{ secrets.NAVER_APIHUB_KEY_ID }}
          NAVER_APIHUB_KEY: ${{ secrets.NAVER_APIHUB_KEY }}
          NAVER_APIHUB_KEY_POOL: ${{ secrets.NAVER_APIHUB_KEY_POOL }}
        run: >-
          node -r ts-node/register/transpile-only scripts/publish-homefeed-speed.ts
          site/spa/public/data/homefeed-speed.json
          site/data/homefeed-speed-observations.json
      - name: Publish speed snapshot
        working-directory: site
        run: |
          git config user.name 'leword-bot'
          git config user.email 'bot@leaderspro.kr'
          git add data/homefeed-speed-observations.json
          if [ -f spa/public/data/homefeed-speed.json ]; then
            git add spa/public/data/homefeed-speed.json
          fi
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore(homefeed): refresh speed measurements'
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then
              echo '::error::Concurrent speed update requires review.'
              exit 1
            fi
            sleep 5
          done
          echo '::error::Speed snapshot publication failed.'
          exit 1
