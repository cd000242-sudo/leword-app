name: 애드센스 고수 벤치마크 발행

# 사장님 엑셀(애드센스 고수 블로그 6,440곳)에서 고른 786곳의 RSS 를 읽어 최근 7일 소재 판을 사이트에 싣는다(2026-10-07).
# 3시간마다 — 깃허브 예약은 늦거나 빠지므로 틱을 두 개 둔다(같은 판이면 커밋하지 않아 중복 실행은 무해).
on:
  schedule:
    - cron: '41 */3 * * *'
    - cron: '11 1-23/3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: adsense-benchmarks
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # 수집은 cheerio 만 쓴다 — electron 바이너리가 필요 없어 설치 스크립트를 건너뛴다.
      - name: npm ci (행업 방어)
        run: |
          for i in 1 2 3; do
            timeout 600 npm ci --ignore-scripts && exit 0
            echo "npm ci 실패 또는 10분 초과 — 재시도 $i/3"
          done
          exit 1
      - name: Test adsense benchmark rules
        run: node --test scripts/adsense-benchmarks.test.cjs scripts/adsense-benchmarks-sources.test.cjs
      - name: Checkout website
        uses: actions/checkout@v4
        with:
          repository: cd000242-sudo/naver
          ssh-key: ${{ secrets.SITE_REPO_SSH_KEY }}
          path: site
      - name: Collect adsense benchmark posts
        run: >-
          node scripts/adsense-benchmarks.cjs
          --output site/spa/public/data/adsense-benchmarks.json
          --concurrency 16
      - name: Publish only the adsense benchmark board
        working-directory: site
        run: |
          git config user.name 'leword-bot'
          git config user.email 'bot@leaderspro.kr'
          git add spa/public/data/adsense-benchmarks.json
          if git diff --cached --quiet; then
            echo 'No adsense benchmark changes.'
            exit 0
          fi
          git commit -m "chore(adsense): refresh adsense benchmark board"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then
              echo '::error::Concurrent adsense benchmark change requires review.'
              exit 1
            fi
            sleep 10
          done
          echo '::error::Adsense benchmark publication failed.'
          exit 1
