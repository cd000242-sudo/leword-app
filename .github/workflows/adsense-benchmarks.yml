name: 애드센스 고수 벤치마크 발행

# 사장님 엑셀(애드센스 고수 블로그 6,440곳)에서 고른 786곳의 RSS 를 읽어 최근 7일 소재 판을 사이트에 싣는다(2026-10-07).
# 3시간마다 — 깃허브 예약은 늦거나 빠지므로 틱을 두 개 둔다(같은 판이면 커밋하지 않아 중복 실행은 무해).
on:
  schedule:
    - cron: '41 */3 * * *'
    - cron: '11 1-23/3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: adsense-benchmarks
  cancel-in-progress: false

jobs:
  publish:
    # 2단계 실측(대표 검색어 검색량 · 입찰가)이 검색광고 키를 쓴다 — 회차당 새 소재 60개, 후보 검색량 5개씩 묶음 + 입찰가.
    # 계정 쿼터 합은 searchad-ceiling-per-job.test 가 잠근다(틱 두 개 · 하루 최대 16회로 센다).
    env:
      LEWORD_SEARCHAD_SOFT_CEILING: '60'
    runs-on: ubuntu-latest
    # 수집 1~2분 · 실측 · 제목(동시 4 · 시간 상한 8분)까지.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # 3단계 제목 엔진(agent-cli)이 electron 을 import 해서 --ignore-scripts 면 제목이 통째로 죽는다(홈판 벤치마크와 같은 이유).
      - name: npm ci (행업 방어)
        run: |
          for i in 1 2 3; do
            timeout 600 npm ci && exit 0
            echo "npm ci 실패 또는 10분 초과 — 재시도 $i/3"
          done
          exit 1
      - name: Test adsense benchmark rules
        run: node --test scripts/adsense-benchmarks.test.cjs scripts/adsense-benchmarks-sources.test.cjs scripts/adsense-benchmarks-measure.test.cjs scripts/enrich-adsense-titles.test.cjs
      # 소재 1개당 구글 · 다음 검색용 제목 20개는 구독 CLI 가 짓는다(홈판 벤치마크 제목과 같은 구조).
      - name: 구독 CLI 폴백 준비
        uses: ./.github/actions/setup-subscription-agents
      - name: Checkout website
        uses: actions/checkout@v4
        with:
          repository: cd000242-sudo/naver
          ssh-key: ${{ secrets.SITE_REPO_SSH_KEY }}
          path: site
      - name: Collect adsense benchmark posts
        run: >-
          node scripts/adsense-benchmarks.cjs
          --output site/spa/public/data/adsense-benchmarks.json
          --concurrency 16
      # 실측 — 대표 검색어(소재 낱말 후보의 정확 검색량 최대) · 블로그 문서수 · 파워링크 3위 입찰가. 7일 캐시는 사이트 레포에 둔다.
      # 실패해도 판은 그대로 나간다(스크립트가 0 으로 끝난다).
      - name: Measure adsense topics
        env:
          NAVER_SEARCH_AD_ACCESS_LICENSE: ${{ secrets.NAVER_SEARCH_AD_ACCESS_LICENSE }}
          NAVER_SEARCH_AD_SECRET_KEY: ${{ secrets.NAVER_SEARCH_AD_SECRET_KEY }}
          NAVER_SEARCH_AD_CUSTOMER_ID: ${{ secrets.NAVER_SEARCH_AD_CUSTOMER_ID }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: >-
          node scripts/adsense-benchmarks-measure.cjs
          --board site/spa/public/data/adsense-benchmarks.json
          --cache site/data/adsense-measure-cache.json
          --max 60
      # 회차당 20장(사장님 결정 2026-10-07: 홈판 40 → 20, 줄인 만큼 애드센스 20). 실측 대표 검색어가 있는 카드만.
      - name: 소재별 검색용 제목 20개 생성·부착
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: >-
          node scripts/enrich-adsense-titles.js
          --board=site/spa/public/data/adsense-benchmarks.json
          --store=site/spa/public/data/adsense-benchmark-titles.json
          --max=20
          --concurrency=4
          --budget-min=8
      - name: Publish only the adsense benchmark board
        working-directory: site
        run: |
          git config user.name 'leword-bot'
          git config user.email 'bot@leaderspro.kr'
          git add spa/public/data/adsense-benchmarks.json
          [ -f data/adsense-measure-cache.json ] && git add data/adsense-measure-cache.json
          [ -f spa/public/data/adsense-benchmark-titles.json ] && git add spa/public/data/adsense-benchmark-titles.json
          if git diff --cached --quiet; then
            echo 'No adsense benchmark changes.'
            exit 0
          fi
          git commit -m "chore(adsense): refresh adsense benchmark board"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then
              echo '::error::Concurrent adsense benchmark change requires review.'
              exit 1
            fi
            sleep 10
          done
          echo '::error::Adsense benchmark publication failed.'
          exit 1
