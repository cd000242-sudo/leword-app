name: 오늘의 네이버 추천키워드 (매일 아침)

# 사이트의 오늘의 네이버 추천키워드 서브탭에 싣는 표(사장님 2026-09-08: 실검
# 틈새와 키워드 분석 사이 서브탭). 창고(data/seed-db.json)에서 주제별 후보를 넓게 뽑아 블로그
# 문서수를 오픈 API로 실측하고 황금비 1 이상을 앞에 두고 나머지를 채워 10개씩 남긴다. BD 를 안 쓴다 — 무료 최대 3,840콜.
#
# 시간대: cron 은 UTC. 한국 06:30 은 UTC 전날 21:30.
# 선점 회차(월·금 07:00 KST)가 창고를 새로 커밋한 뒤에 도는 날은 새 창고를, 아니면 직전 창고를 읽는다.
on:
  schedule:
    - cron: '30 21 * * *'
  workflow_dispatch:

concurrency:
  group: today-picks
  cancel-in-progress: false

jobs:
  picks:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: npm ci (행업 방어)
        run: |
          for i in 1 2 3; do
            timeout 600 npm ci && exit 0
            echo "npm ci 실패 또는 10분 초과 — 재시도 $i/3"
          done
          exit 1

      # 발행 경로가 막혔으면 문서수를 재 봐야 소용없다 — 먼저 본다.
      - name: 필수 시크릿 확인
        env:
          REQUIRED: |
            NAVER_CLIENT_ID=${{ secrets.NAVER_CLIENT_ID != '' }}
            NAVER_CLIENT_SECRET=${{ secrets.NAVER_CLIENT_SECRET != '' }}
            SITE_REPO_SSH_KEY=${{ secrets.SITE_REPO_SSH_KEY != '' }}
        run: |
          missing=0
          while IFS='=' read -r name present; do
            [ -z "$name" ] && continue
            if [ "$present" != 'true' ]; then echo "::error::시크릿 없음 — $name"; missing=1; fi
          done <<< "$REQUIRED"
          [ "$missing" -eq 1 ] && exit 1
          echo '필수 시크릿 확인됨.'

      - name: 추천키워드 뽑기 (창고 → 문서수 실측 → 황금비)
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          NAVER_APIHUB_KEY_ID: ${{ secrets.NAVER_APIHUB_KEY_ID }}
          NAVER_APIHUB_KEY: ${{ secrets.NAVER_APIHUB_KEY }}
        run: node scripts/today-picks.js --out=today-picks.json --perTopic=120 --keep=10 --minRatio=1

      - name: 사이트 레포 체크아웃
        uses: actions/checkout@v4
        with:
          repository: cd000242-sudo/naver
          ssh-key: ${{ secrets.SITE_REPO_SSH_KEY }}
          path: site

      # 실검 틈새 보드와 같은 폴더 — 화면(TodayPicksBoard)이 /data/today-picks.json 을 읽는다.
      - name: 사이트에 싣기
        run: cp today-picks.json site/spa/public/data/today-picks.json

      - name: 커밋·푸시
        working-directory: site
        run: |
          git config user.name 'leword-bot'
          git config user.email 'bot@leaderspro.kr'
          git add spa/public/data/today-picks.json
          if git diff --cached --quiet; then echo '변경 없음.'; exit 0; fi
          git commit -m "chore(picks): 오늘의 네이버 추천키워드 $(date -u '+%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push
