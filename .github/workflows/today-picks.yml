name: 오늘의 네이버 추천키워드 (오전·오후·저녁)

# 한국 06:30 / 13:30 / 19:30 세 회차. 각 +1h/+2h는 누락 복구용이며
# 회차 문지기가 중복 작업을 막는다. 씨앗과 24h 문서수 캐시를 회차끼리 공유한다.
on:
  schedule:
    - cron: '30 21,22,23 * * *'
    - cron: '30 4,5,6 * * *'
    - cron: '30 10,11,12 * * *'
  workflow_dispatch:
    inputs:
      # 앱의 회차 감시견이 '빠진 회차'를 대신 깨울 때 true 로 넣는다.
      # 그러면 예약과 똑같이 문지기를 거쳐, 그 사이 회차가 실렸으면 헛돌지 않는다.
      respectDone:
        description: 이미 실린 회차면 건너뛴다 (감시견이 깨울 때 true)
        default: 'false'

concurrency:
  group: today-picks
  cancel-in-progress: false

jobs:
  # ── 0) 문지기 ───────────────────────────────────────────────────────────────
  # 한 회차를 여러 틱으로 예약해 뒀으므로, 먼저 돈 틱이 이미 실었으면 나머지는 곧장 나간다.
  # 앱 감시견이 깨울 때도(respectDone=true) 같은 판정을 거친다 — 그 사이 회차가 실렸으면 헛돌지 않게.
  # 사장님이 손으로 돌린 것은 "다시 돌려라"는 뜻이므로 건너뛰지 않는다.
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.check.outputs.done }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        env:
          RESPECT: ${{ (github.event_name == 'schedule' || github.event.inputs.respectDone == 'true') && 'true' || 'false' }}
        run: |
          if [ "$RESPECT" != 'true' ]; then
            echo '손으로 돌린 실행이다 — 건너뛰지 않는다.'
            echo 'done=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node scripts/today-picks-done.js --url=https://leaderspro.kr/data/today-picks.json --keep=30

  picks:
    # 검색광고 일일 쿼터(계정 25,000)를 러너들이 나눠 쓴다(2026-09-15). 장부는 러너의 tmpdir 이라 잡마다 새 장부 —
    # 상한을 안 주면 러너마다 22,000 을 혼자 쓴다. 합은 searchad-ceiling-per-job.test 가 잠근다.
    # 창고 갱신의 씨앗 검색량 + 뽑기의 입찰가(2026-09-24 — 보여 줄 행만, 주제당 2콜 · 32주제 64콜).
    env:
      LEWORD_SEARCHAD_SOFT_CEILING: '550'
    needs: guard
    if: ${{ needs.guard.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150  # 2026-09-09 실측: 40분에 32주제 중 15주제(호출 2,141) — 문서수 실측이 주제당 2~3분
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: npm ci (행업 방어)
        run: |
          for i in 1 2 3; do
            timeout 600 npm ci && exit 0
            echo "npm ci 실패 또는 10분 초과 — 재시도 $i/3"
          done
          exit 1

      # 발행 경로가 막혔으면 문서수를 재 봐야 소용없다 — 먼저 본다.
      - name: 필수 시크릿 확인
        env:
          REQUIRED: |
            NAVER_CLIENT_ID=${{ secrets.NAVER_CLIENT_ID != '' }}
            NAVER_CLIENT_SECRET=${{ secrets.NAVER_CLIENT_SECRET != '' }}
            SITE_REPO_SSH_KEY=${{ secrets.SITE_REPO_SSH_KEY != '' }}
        run: |
          missing=0
          while IFS='=' read -r name present; do
            [ -z "$name" ] && continue
            if [ "$present" != 'true' ]; then echo "::error::시크릿 없음 — $name"; missing=1; fi
          done <<< "$REQUIRED"
          [ "$missing" -eq 1 ] && exit 1
          echo '필수 시크릿 확인됨.'

      # 어제 실린 판을 먼저 가져온다 — 같은 것을 또 내지 않으려면 무엇을 냈는지 알아야 한다.
      - name: 사이트 레포 체크아웃
        uses: actions/checkout@v4
        with:
          repository: cd000242-sudo/naver
          ssh-key: ${{ secrets.SITE_REPO_SSH_KEY }}
          path: site

      - name: 한국 날짜
        id: day
        run: echo "value=$(TZ=Asia/Seoul date +%F)" >> "$GITHUB_OUTPUT"

      - name: 오늘 실측·씨앗 캐시 복원
        uses: actions/cache/restore@v4
        with:
          path: |
            .today-picks-cache
            data/seed-db.json
          key: today-picks-v1-${{ steps.day.outputs.value }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: today-picks-v1-${{ steps.day.outputs.value }}-

      # 창고가 안 바뀌면 뽑는 답도 안 바뀐다 — 매일 새로 긁는다(무료 호출 200여 회, BD 안 씀).
      # 실패해도 회차는 살린다: 레포에 있는 직전 창고로 계속 간다.
      - name: 씨앗 창고 갱신 (매일)
        continue-on-error: true
        env:
          NAVER_SEARCH_AD_ACCESS_LICENSE: ${{ secrets.NAVER_SEARCH_AD_ACCESS_LICENSE }}
          NAVER_SEARCH_AD_SECRET_KEY: ${{ secrets.NAVER_SEARCH_AD_SECRET_KEY }}
          NAVER_SEARCH_AD_CUSTOMER_ID: ${{ secrets.NAVER_SEARCH_AD_CUSTOMER_ID }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          NAVER_APIHUB_KEY_ID: ${{ secrets.NAVER_APIHUB_KEY_ID }}
          NAVER_APIHUB_KEY: ${{ secrets.NAVER_APIHUB_KEY }}
        run: node scripts/build-seed-db.js --maxAgeDays=1

      - name: 추천키워드 뽑기 (창고 → 문서수 실측 → 7일 신규 우선 · 황금비 · 입찰가)
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          NAVER_APIHUB_KEY_ID: ${{ secrets.NAVER_APIHUB_KEY_ID }}
          NAVER_APIHUB_KEY: ${{ secrets.NAVER_APIHUB_KEY }}
          NAVER_SEARCH_AD_ACCESS_LICENSE: ${{ secrets.NAVER_SEARCH_AD_ACCESS_LICENSE }}
          NAVER_SEARCH_AD_SECRET_KEY: ${{ secrets.NAVER_SEARCH_AD_SECRET_KEY }}
          NAVER_SEARCH_AD_CUSTOMER_ID: ${{ secrets.NAVER_SEARCH_AD_CUSTOMER_ID }}
        run: node scripts/today-picks.js --out=today-picks.json --perTopic=120 --keep=30 --minRatio=1 --carry=site/spa/public/data/today-picks.json --measurementCache=.today-picks-cache/documents.json --respectDone=${{ (github.event_name == 'schedule' || github.event.inputs.respectDone == 'true') && 'true' || 'false' }}

      - name: 다음 회차를 위한 실측·씨앗 캐시 저장
        uses: actions/cache/save@v4
        with:
          path: |
            .today-picks-cache
            data/seed-db.json
          key: today-picks-v1-${{ steps.day.outputs.value }}-${{ github.run_id }}-${{ github.run_attempt }}

      # 실검 틈새 보드와 같은 폴더 — 화면(TodayPicksBoard)이 /data/today-picks.json 을 읽는다.
      - name: 사이트에 싣기
        run: cp today-picks.json site/spa/public/data/today-picks.json

      - name: 커밋·푸시
        working-directory: site
        run: |
          git config user.name 'leword-bot'
          git config user.email 'bot@leaderspro.kr'
          git add spa/public/data/today-picks.json
          if git diff --cached --quiet; then echo '변경 없음.'; exit 0; fi
          git commit -m "chore(picks): 오늘의 네이버 추천키워드 $(date -u '+%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push
