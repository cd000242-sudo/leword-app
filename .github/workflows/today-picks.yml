name: 오늘의 네이버 추천키워드 (매일 아침)

# 사이트의 오늘의 네이버 추천키워드 서브탭에 싣는 표(사장님 2026-09-08: 실검
# 틈새와 키워드 분석 사이 서브탭). 창고(data/seed-db.json)에서 주제별 후보를 넓게 뽑아 블로그
# 문서수를 오픈 API로 실측하고 황금비 1 이상을 앞에 두고 나머지를 채워 10개씩 남긴다. BD 를 안 쓴다 — 무료 최대 3,840콜.
#
# 시간대: cron 은 UTC. 한국 06:30 은 UTC 전날 21:30.
# 창고는 여기서 **매일** 새로 긁는다(2026-09-10). 전에는 선점 회차(일요일 밤)가 지은 것을 그대로 읽었는데,
# 뽑는 방식이 완전히 결정적이라(주제별 검색량 상위 120 → 문서수 실측 → 황금비 순 10개) 창고가 같으면
# 답도 같았다. 실측: 9/10 판이 9/9 판과 320개 중 319개 일치. 창고 갱신은 무료 호출 200여 회라 매일 돌 만하다.
# 그래도 겹치면 어제 실린 것을 빼고 그다음을 낸다(--carry).
on:
  schedule:
    # 한 회차를 세 틱으로 건다(2026-09-12). :30 한 틱만 걸어 뒀더니 늘 2시간쯤 늦게 돌고
    # (09-09 08:35 · 09-10 08:27 · 09-11 08:21 실측) 사장님이 "어제 돌린 게 최신"이라고 하셨다.
    # 먼저 도는 하나만 일한다 — 나머지는 아래 문지기에서 곧장 나간다.
    # 한국 06:30 · 07:30 · 08:30 = UTC 전날 21:30 · 22:30 · 23:30
    - cron: '30 21 * * *'
    - cron: '30 22 * * *'
    - cron: '30 23 * * *'
  workflow_dispatch:
    inputs:
      # 앱의 회차 감시견이 '빠진 회차'를 대신 깨울 때 true 로 넣는다.
      # 그러면 예약과 똑같이 문지기를 거쳐, 그 사이 회차가 실렸으면 헛돌지 않는다.
      respectDone:
        description: 이미 실린 회차면 건너뛴다 (감시견이 깨울 때 true)
        default: 'false'

concurrency:
  group: today-picks
  cancel-in-progress: false

jobs:
  # ── 0) 문지기 ───────────────────────────────────────────────────────────────
  # 한 회차를 여러 틱으로 예약해 뒀으므로, 먼저 돈 틱이 이미 실었으면 나머지는 곧장 나간다.
  # 앱 감시견이 깨울 때도(respectDone=true) 같은 판정을 거친다 — 그 사이 회차가 실렸으면 헛돌지 않게.
  # 사장님이 손으로 돌린 것은 "다시 돌려라"는 뜻이므로 건너뛰지 않는다.
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.check.outputs.done }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        env:
          RESPECT: ${{ (github.event_name == 'schedule' || github.event.inputs.respectDone == 'true') && 'true' || 'false' }}
        run: |
          if [ "$RESPECT" != 'true' ]; then
            echo '손으로 돌린 실행이다 — 건너뛰지 않는다.'
            echo 'done=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node scripts/board-round-done.js --url=https://leaderspro.kr/data/today-picks.json --field=builtAt --rounds=06:30

  picks:
    needs: guard
    if: ${{ needs.guard.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150  # 2026-09-09 실측: 40분에 32주제 중 15주제(호출 2,141) — 문서수 실측이 주제당 2~3분
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: npm ci (행업 방어)
        run: |
          for i in 1 2 3; do
            timeout 600 npm ci && exit 0
            echo "npm ci 실패 또는 10분 초과 — 재시도 $i/3"
          done
          exit 1

      # 발행 경로가 막혔으면 문서수를 재 봐야 소용없다 — 먼저 본다.
      - name: 필수 시크릿 확인
        env:
          REQUIRED: |
            NAVER_CLIENT_ID=${{ secrets.NAVER_CLIENT_ID != '' }}
            NAVER_CLIENT_SECRET=${{ secrets.NAVER_CLIENT_SECRET != '' }}
            SITE_REPO_SSH_KEY=${{ secrets.SITE_REPO_SSH_KEY != '' }}
        run: |
          missing=0
          while IFS='=' read -r name present; do
            [ -z "$name" ] && continue
            if [ "$present" != 'true' ]; then echo "::error::시크릿 없음 — $name"; missing=1; fi
          done <<< "$REQUIRED"
          [ "$missing" -eq 1 ] && exit 1
          echo '필수 시크릿 확인됨.'

      # 어제 실린 판을 먼저 가져온다 — 같은 것을 또 내지 않으려면 무엇을 냈는지 알아야 한다.
      - name: 사이트 레포 체크아웃
        uses: actions/checkout@v4
        with:
          repository: cd000242-sudo/naver
          ssh-key: ${{ secrets.SITE_REPO_SSH_KEY }}
          path: site

      # 창고가 안 바뀌면 뽑는 답도 안 바뀐다 — 매일 새로 긁는다(무료 호출 200여 회, BD 안 씀).
      # 실패해도 회차는 살린다: 레포에 있는 직전 창고로 계속 간다.
      - name: 씨앗 창고 갱신 (매일)
        continue-on-error: true
        env:
          NAVER_SEARCH_AD_ACCESS_LICENSE: ${{ secrets.NAVER_SEARCH_AD_ACCESS_LICENSE }}
          NAVER_SEARCH_AD_SECRET_KEY: ${{ secrets.NAVER_SEARCH_AD_SECRET_KEY }}
          NAVER_SEARCH_AD_CUSTOMER_ID: ${{ secrets.NAVER_SEARCH_AD_CUSTOMER_ID }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          NAVER_APIHUB_KEY_ID: ${{ secrets.NAVER_APIHUB_KEY_ID }}
          NAVER_APIHUB_KEY: ${{ secrets.NAVER_APIHUB_KEY }}
        run: node scripts/build-seed-db.js --maxAgeDays=1

      - name: 추천키워드 뽑기 (창고 → 문서수 실측 → 황금비 · 어제 것 제외)
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          NAVER_APIHUB_KEY_ID: ${{ secrets.NAVER_APIHUB_KEY_ID }}
          NAVER_APIHUB_KEY: ${{ secrets.NAVER_APIHUB_KEY }}
        run: node scripts/today-picks.js --out=today-picks.json --perTopic=120 --keep=10 --minRatio=1 --carry=site/spa/public/data/today-picks.json

      # 실검 틈새 보드와 같은 폴더 — 화면(TodayPicksBoard)이 /data/today-picks.json 을 읽는다.
      - name: 사이트에 싣기
        run: cp today-picks.json site/spa/public/data/today-picks.json

      - name: 커밋·푸시
        working-directory: site
        run: |
          git config user.name 'leword-bot'
          git config user.email 'bot@leaderspro.kr'
          git add spa/public/data/today-picks.json
          if git diff --cached --quiet; then echo '변경 없음.'; exit 0; fi
          git commit -m "chore(picks): 오늘의 네이버 추천키워드 $(date -u '+%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push
