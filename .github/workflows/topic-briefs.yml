name: 오늘의 글감 (하루 3회차)

# 사이트의 '오늘의 글감' 탭(NOW/NEXT/ALWAYS 글감 브리프, 사장님 예시 형식 2026-09-09)에 싣는다.
# 분야별로 네이버 뉴스 API 기사를 실측해 사실 카드를 만들고, 클로드 CLI(구독 OAuth)가 카드 안에서만 글감을 고르며,
# 검증기가 카드에 없는 날짜·숫자를 떨어뜨린다. 검색량은 검색광고 실측.
#
# 자리(SERP) 실측은 Bright Data 로 회차 글감 전부(상한 80, 검색량 큰 순, 앞 회차가 잰 검색어는 재활용) — 사장님 승인 2026-09-09 오후.
# 기능 'briefs' 장부는 사이트 레포 data/brightdata-quota-briefs.json 에 두고 표와 함께 커밋한다(회차마다 새 러너라 파일이 기억이다).
# 달 상한 12,000 — 핵심 80 + 대안 검색어 70(낮음·보통 글감의 좁은 검색어 자리 실측, 사장님 2026-09-09 오후) × 3회. 무료 5,000 을 넘는 몫은 유료(약 $1.5/1,000) — 황금(달 4,000)·실검(1,100)과 합쳐 약 $11.
#
# 시간대: cron 은 UTC. 한국 06:23·12:23·18:23 은 UTC 전날 21:23·03:23·09:23. 추천키워드(21:30)와 다른 워크플로라 겹쳐 돌아도 된다.
on:
  schedule:
    # 하루 3회차 — 아침 07:00 · 오후 13:00 · 저녁 19:00 KST (사장님 2026-09-09: 시의성 글감은 낮에도 생긴다)
    # 정각을 피한다(:23) — GitHub 는 정각 스케줄을 몰려서 미루거나 떨어뜨린다. 2026-09-09 13:00 회차가 안 돌았고 추천키워드 06:30 은 2시간 늦게 돌았다(실측).
    #
    # 회차마다 예약을 세 번 건다(2026-09-10). :23 으로 옮긴 뒤에도 예약이 늦거나 빠졌다 —
    # 09-09 09:23 예약은 13:47 에 돌았고(4.4시간 늦음), 21:23·03:23 예약은 아예 돌지 않았다.
    # 늦으면 회차 이름까지 밀린다: 아침 예약이 한국시간 11시를 넘겨 돌면 '오후'로 기록되고
    # 아침 회차는 그날 통째로 빈다(09-09 아침이 그랬다).
    # 먼저 도는 하나만 일하고 나머지는 --skipIfSlotDone 으로 곧장 나간다(비용 드는 단계 앞에서).
    # 아침 = 한국 06:23 · 07:23 · 08:23
    - cron: '23 21 * * *'
    - cron: '23 22 * * *'
    - cron: '23 23 * * *'
    # 오후 = 한국 12:23 · 13:23 · 14:23
    - cron: '23 3 * * *'
    - cron: '23 4 * * *'
    - cron: '23 5 * * *'
    # 저녁 = 한국 18:23 · 19:23 · 20:23
    - cron: '23 9 * * *'
    - cron: '23 10 * * *'
    - cron: '23 11 * * *'
  workflow_dispatch:
    inputs:
      serp:
        description: '자리 실측 — brightdata(기본, 회차 최대 maxSerp 건) | none(미측정으로 발행)'
        default: 'brightdata'
        required: false
      maxSerp:
        description: '자리 실측 상한(건) — 기본 80 = 회차 글감 전부'
        default: '80'
        required: false
      # 앱의 회차 감시견이 '빠진 회차'를 대신 깨울 때 true 로 넣는다.
      # 그러면 예약과 똑같이 skipIfSlotDone 을 거쳐, 그 사이 회차가 실렸으면 헛돌지 않는다.
      respectDone:
        description: 이미 실린 회차면 건너뛴다 (감시견이 깨울 때 true)
        default: 'false'
        required: false

concurrency:
  group: topic-briefs
  cancel-in-progress: false

jobs:
  briefs:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: npm ci (행업 방어)
        run: |
          for i in 1 2 3; do
            timeout 600 npm ci && exit 0
            echo "npm ci 실패 또는 10분 초과 — 재시도 $i/3"
          done
          exit 1

      - name: 필수 시크릿 확인
        env:
          REQUIRED: |
            NAVER_CLIENT_ID=${{ secrets.NAVER_CLIENT_ID != '' }}
            NAVER_CLIENT_SECRET=${{ secrets.NAVER_CLIENT_SECRET != '' }}
            CLAUDE_CODE_OAUTH_TOKEN=${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
            BRIGHTDATA_TOKEN=${{ secrets.BRIGHTDATA_TOKEN != '' }}
            SITE_REPO_SSH_KEY=${{ secrets.SITE_REPO_SSH_KEY != '' }}
        run: |
          missing=0
          while IFS='=' read -r name present; do
            [ -z "$name" ] && continue
            if [ "$present" != 'true' ]; then echo "::error::시크릿 없음 — $name"; missing=1; fi
          done <<< "$REQUIRED"
          [ "$missing" -eq 1 ] && exit 1
          echo '필수 시크릿 확인됨.'

      # 장부(data/brightdata-quota-briefs.json)를 읽어야 하므로 글감 뽑기보다 먼저 받는다.
      - name: 사이트 레포 체크아웃
        uses: actions/checkout@v4
        with:
          repository: cd000242-sudo/naver
          ssh-key: ${{ secrets.SITE_REPO_SSH_KEY }}
          path: site

      - name: 글감 뽑기 (뉴스 실측 → 사실 카드 → 에이전트 → 검증 → 검색량 실측 → 자리 실측)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          NAVER_APIHUB_KEY_ID: ${{ secrets.NAVER_APIHUB_KEY_ID }}
          NAVER_APIHUB_KEY: ${{ secrets.NAVER_APIHUB_KEY }}
          NAVER_SEARCH_AD_ACCESS_LICENSE: ${{ secrets.NAVER_SEARCH_AD_ACCESS_LICENSE }}
          NAVER_SEARCH_AD_SECRET_KEY: ${{ secrets.NAVER_SEARCH_AD_SECRET_KEY }}
          NAVER_SEARCH_AD_CUSTOMER_ID: ${{ secrets.NAVER_SEARCH_AD_CUSTOMER_ID }}
          BRIGHTDATA_TOKEN: ${{ secrets.BRIGHTDATA_TOKEN }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
          LEWORD_BRIGHTDATA_QUOTA_STATE_FILE: ${{ github.workspace }}/site/data/brightdata-quota-briefs.json
          # 달 12,000 건에서 기능 자체를 잠근다((80 + 대안 70) × 3회 × 31 = 13,950 이 이론 최대, 실제는 대안 대상이 절반 이하).
          # 사장님 2026-09-09 오후: "글감 자리 실측을 전부 해도 되지 않아? 20달러 내로 가능할 듯" — 황금 회차를 주 1회로 줄여 예산을 옮겼다.
          #
          # ── 계정 무료 5,000 을 레인끼리 나눠 갖는다(2026-09-11) ──
          # 거버너의 FREE_CEILING 은 **장부 파일 하나의 total** 에 적용된다. 그런데 레인마다 장부가
          # 따로라(golden·briefs·issue) 셋이 각자 "나는 무료 5,000 이 있다"고 믿었다.
          # 브라이트데이터 계정의 무료는 월 5,000 하나뿐이다 — 고치기 전 최악이 유료 19,000콜 = $28.50 이었다.
          #
          # 몫은 9월 실측 속도로 나눴다(2026-09-01~11): golden 월 10,320 · briefs 월 2,326 · issue 월 649.
          #   golden 3,800 + briefs 900 + issue 300 = 5,000  (정확히 계정 무료)
          # 유료 상한도 레인마다 못 박는다(기본값 0 이라 안 적으면 그 레인은 무료에서 멈춘다):
          #   golden 9,000 + briefs 2,500 + issue 1,000 = 12,500콜 × $1.50/1,000 = **$18.75**
          # 사장님 한도 "20달러만 안 넘으면 된다"(2026-09-07) 안이다.
          # 이 산수는 brightdata-budget-invariant.test.ts 가 세 워크플로를 읽어 잠근다 — 한쪽만 올리면 깨진다.
          LEWORD_BRIGHTDATA_FREE_CEILING: '900'
          LEWORD_BRIGHTDATA_PAID_OVERAGE: '2500'
          LEWORD_BRIGHTDATA_FEATURE_CAPS: '{"briefs":3400}'
          SERP_MODE: ${{ github.event.inputs.serp || 'brightdata' }}
          MAX_SERP: ${{ github.event.inputs.maxSerp || '80' }}
          SKIP_IF_DONE: ${{ (github.event_name == 'schedule' || github.event.inputs.respectDone == 'true') && 'true' || 'false' }}
        run: |
          mkdir -p site/data
          npm install -g @anthropic-ai/claude-code
          # skipIfSlotDone: 이 회차가 오늘 이미 실렸으면 곧장 나간다(예약을 회차마다 세 번 걸어 둔 까닭).
          # 수동 실행(workflow_dispatch)은 다시 돌리려는 뜻이므로 건너뛰지 않는다.
          # --schedule: 어느 예약이 발동했는지. 이게 없으면 스크립트가 시계로 회차를 정하는데,
          # 자정을 넘겨 늦게 돈 저녁 예약이 다음 날 아침 회차를 잡아먹는다(실측 2026-09-11).
          node scripts/topic-briefs.js --out=topic-briefs.json --perField=5 --carry=site/spa/public/data/topic-briefs.json --serp="$SERP_MODE" --maxSerp="$MAX_SERP" --maxAltSerp=70 --skipIfSlotDone="$SKIP_IF_DONE" --schedule="${{ github.event.schedule }}"

      # 다른 정적 보드와 같은 폴더 — 화면(TopicBriefsBoard)이 /data/topic-briefs.json 을 읽는다.
      #
      # 파일이 없으면 건너뛴다. --skipIfSlotDone 으로 곧장 나간 틱은 결과 파일을 만들지 않는다 —
      # 그걸 그대로 cp 하면 "No such file" 로 회차가 빨갛게 실패한다(2026-09-09 23:23 틱이 그랬다).
      # 일 안 한 틱은 실패가 아니라 정상이다.
      - name: 사이트에 싣기
        run: |
          if [ ! -f topic-briefs.json ]; then
            echo '이번 틱은 이미 실린 회차라 건너뛰었다 — 실을 것이 없다.'
            exit 0
          fi
          cp topic-briefs.json site/spa/public/data/topic-briefs.json

      - name: 커밋·푸시
        working-directory: site
        run: |
          git config user.name 'leword-bot'
          git config user.email 'bot@leaderspro.kr'
          git add spa/public/data/topic-briefs.json
          [ -f data/brightdata-quota-briefs.json ] && git add data/brightdata-quota-briefs.json
          if git diff --cached --quiet; then echo '변경 없음.'; exit 0; fi
          git commit -m "chore(briefs): 오늘의 글감 회차 $(date -u '+%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push origin HEAD:main
