name: 오늘의 글감 (하루 3회차)

# 사이트의 '오늘의 글감' 탭(NOW/NEXT/ALWAYS 글감 브리프, 사장님 예시 형식 2026-09-09)에 싣는다.
# 분야별로 네이버 뉴스 API 기사를 실측해 사실 카드를 만들고, 클로드 CLI(구독 OAuth)가 카드 안에서만 글감을 고르며,
# 검증기가 카드에 없는 날짜·숫자를 떨어뜨린다. 검색량은 검색광고 실측.
#
# 자리(SERP) 실측은 Bright Data 로 회차당 12건(검색량 큰 순, 앞 회차가 잰 검색어는 재활용) — 사장님 승인 2026-09-09. 기능 'briefs' 장부는
# 사이트 레포 data/brightdata-quota-briefs.json 에 두고 표와 함께 커밋한다(회차마다 새 러너라 파일이 기억이다).
# 달 상한 1,200 = 12 × 3회 × 31 = 1,116 의 여유분. 선점(golden)·실검(issue) 장부와 별개이며 무료 5,000 안이다.
#
# 시간대: cron 은 UTC. 한국 06:23·12:23·18:23 은 UTC 전날 21:23·03:23·09:23. 추천키워드(21:30)와 다른 워크플로라 겹쳐 돌아도 된다.
on:
  schedule:
    # 하루 3회차 — 아침 07:00 · 오후 13:00 · 저녁 19:00 KST (사장님 2026-09-09: 시의성 글감은 낮에도 생긴다)
    # 정각을 피한다(:23) — GitHub 는 정각 스케줄을 몰려서 미루거나 떨어뜨린다. 2026-09-09 13:00 회차가 안 돌았고 추천키워드 06:30 은 2시간 늦게 돌았다(실측).
    - cron: '23 21 * * *'
    - cron: '23 3 * * *'
    - cron: '23 9 * * *'
  workflow_dispatch:
    inputs:
      serp:
        description: '자리 실측 — brightdata(기본, 회차 최대 maxSerp 건) | none(미측정으로 발행)'
        default: 'brightdata'
        required: false
      maxSerp:
        description: '자리 실측 상한(건)'
        default: '12'
        required: false

concurrency:
  group: topic-briefs
  cancel-in-progress: false

jobs:
  briefs:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: npm ci (행업 방어)
        run: |
          for i in 1 2 3; do
            timeout 600 npm ci && exit 0
            echo "npm ci 실패 또는 10분 초과 — 재시도 $i/3"
          done
          exit 1

      - name: 필수 시크릿 확인
        env:
          REQUIRED: |
            NAVER_CLIENT_ID=${{ secrets.NAVER_CLIENT_ID != '' }}
            NAVER_CLIENT_SECRET=${{ secrets.NAVER_CLIENT_SECRET != '' }}
            CLAUDE_CODE_OAUTH_TOKEN=${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
            BRIGHTDATA_TOKEN=${{ secrets.BRIGHTDATA_TOKEN != '' }}
            SITE_REPO_SSH_KEY=${{ secrets.SITE_REPO_SSH_KEY != '' }}
        run: |
          missing=0
          while IFS='=' read -r name present; do
            [ -z "$name" ] && continue
            if [ "$present" != 'true' ]; then echo "::error::시크릿 없음 — $name"; missing=1; fi
          done <<< "$REQUIRED"
          [ "$missing" -eq 1 ] && exit 1
          echo '필수 시크릿 확인됨.'

      # 장부(data/brightdata-quota-briefs.json)를 읽어야 하므로 글감 뽑기보다 먼저 받는다.
      - name: 사이트 레포 체크아웃
        uses: actions/checkout@v4
        with:
          repository: cd000242-sudo/naver
          ssh-key: ${{ secrets.SITE_REPO_SSH_KEY }}
          path: site

      - name: 글감 뽑기 (뉴스 실측 → 사실 카드 → 에이전트 → 검증 → 검색량 실측 → 자리 실측)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          NAVER_APIHUB_KEY_ID: ${{ secrets.NAVER_APIHUB_KEY_ID }}
          NAVER_APIHUB_KEY: ${{ secrets.NAVER_APIHUB_KEY }}
          NAVER_SEARCH_AD_ACCESS_LICENSE: ${{ secrets.NAVER_SEARCH_AD_ACCESS_LICENSE }}
          NAVER_SEARCH_AD_SECRET_KEY: ${{ secrets.NAVER_SEARCH_AD_SECRET_KEY }}
          NAVER_SEARCH_AD_CUSTOMER_ID: ${{ secrets.NAVER_SEARCH_AD_CUSTOMER_ID }}
          BRIGHTDATA_TOKEN: ${{ secrets.BRIGHTDATA_TOKEN }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
          LEWORD_BRIGHTDATA_QUOTA_STATE_FILE: ${{ github.workspace }}/site/data/brightdata-quota-briefs.json
          # 달 1,200 건에서 기능 자체를 잠근다(12 × 3회 × 31 = 1,116 이 이론 최대 — 앞 회차 재활용으로 실제는 더 적다).
          LEWORD_BRIGHTDATA_FEATURE_CAPS: '{"briefs":1200}'
          SERP_MODE: ${{ github.event.inputs.serp || 'brightdata' }}
          MAX_SERP: ${{ github.event.inputs.maxSerp || '12' }}
        run: |
          mkdir -p site/data
          npm install -g @anthropic-ai/claude-code
          node scripts/topic-briefs.js --out=topic-briefs.json --perField=5 --carry=site/spa/public/data/topic-briefs.json --serp="$SERP_MODE" --maxSerp="$MAX_SERP"

      # 다른 정적 보드와 같은 폴더 — 화면(TopicBriefsBoard)이 /data/topic-briefs.json 을 읽는다.
      - name: 사이트에 싣기
        run: cp topic-briefs.json site/spa/public/data/topic-briefs.json

      - name: 커밋·푸시
        working-directory: site
        run: |
          git config user.name 'leword-bot'
          git config user.email 'bot@leaderspro.kr'
          git add spa/public/data/topic-briefs.json
          [ -f data/brightdata-quota-briefs.json ] && git add data/brightdata-quota-briefs.json
          if git diff --cached --quiet; then echo '변경 없음.'; exit 0; fi
          git commit -m "chore(briefs): 오늘의 글감 회차 $(date -u '+%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push origin HEAD:main
