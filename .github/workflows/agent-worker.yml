name: AI 에이전트 작업자

# 사이트는 서버가 없다(Vultr 폐지) — 에이전트 작업자는 GitHub Actions 가 맡는다.
# Claude → Codex → Gemini 공통 실행기로 구독 로그인을 사용한다.
#
# 수동 테스트: Actions 탭 → "AI 에이전트 작업자" → Run workflow (mode=test).
# 실제 생성에 성공한 제공자·시도 순서가 로그에 찍힌다. 오류 응답은 실패 처리한다.
#
# 사전 준비(1회): 사장님 PC 터미널에서 `claude setup-token` 실행 → 나온 토큰을
#   gh secret set CLAUDE_CODE_OAUTH_TOKEN -R cd000242-sudo/leword-app
# 로 등록. 토큰을 채팅·코드에 붙여넣지 말 것.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'test(폴백 연동 테스트) | enrich(회차 보강)'
        default: 'test'
      prompt:
        description: 'test 모드에서 보낼 프롬프트(비우면 기본 문장)'
        default: ''

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 구독 CLI 폴백 준비
        uses: ./.github/actions/setup-subscription-agents

      - name: 실제 폴백 연결 확인
        if: ${{ inputs.mode == 'test' }}
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          AGENT_TEST_PROMPT: ${{ inputs.prompt }}
        run: |
          for i in 1 2 3; do
            timeout 600 npm ci && break
            if [ "$i" -eq 3 ]; then exit 1; fi
          done
          node scripts/test-agent-chain.js

      # 회차 보강 — 발행된 보드를 다시 보강해 재발행한다(어드민 버튼용).
      # 정기 회차는 preemption-board.yml 안에서 발행 전에 자동 보강되므로,
      # 이 모드는 "지금 떠 있는 보드를 더 채우고 싶다"는 온디맨드 용도다.
      - name: 사이트 레포 체크아웃 (enrich)
        if: ${{ inputs.mode == 'enrich' }}
        uses: actions/checkout@v4
        with:
          repository: cd000242-sudo/naver
          ssh-key: ${{ secrets.SITE_REPO_SSH_KEY }}
          path: site

      - name: 회차 보강 (published board 재보강)
        if: ${{ inputs.mode == 'enrich' }}
        # 스텝 자체 제한 + 계속 진행: 여기서 잘려도 아래 커밋 스텝이 체크포인트
        # (행마다 저장되는 enriched.json)를 주워 부분본이라도 발행한다.
        # 잡 제한(170분)에 걸리면 커밋 스텝까지 죽으므로 스텝 제한을 더 짧게 둔다.
        timeout-minutes: 150
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          NAVER_SEARCH_AD_ACCESS_LICENSE: ${{ secrets.NAVER_SEARCH_AD_ACCESS_LICENSE }}
          NAVER_SEARCH_AD_SECRET_KEY: ${{ secrets.NAVER_SEARCH_AD_SECRET_KEY }}
          NAVER_SEARCH_AD_CUSTOMER_ID: ${{ secrets.NAVER_SEARCH_AD_CUSTOMER_ID }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          NAVER_APIHUB_KEY_ID: ${{ secrets.NAVER_APIHUB_KEY_ID }}
          NAVER_APIHUB_KEY: ${{ secrets.NAVER_APIHUB_KEY }}
        run: |
          for i in 1 2 3; do
            timeout 600 npm ci && break
            echo "npm ci 재시도 $i/3"
          done
          # 발행본은 이미 화면 형식이다 — 보강 스크립트는 서브·제목 필드만 얹으므로
          # 재변환(publish) 없이 그대로 되쓴다. 발행 변환기를 다시 태우면 raw/공개
          # 형식 차이(serp.sections vs serpSections)로 데이터가 망가진다.
          node scripts/enrich-board.js --in=site/spa/public/data/preemption-board.json --out=enriched.json --maxAi=60

      - name: 보강본 커밋 (enrich)
        if: ${{ inputs.mode == 'enrich' }}
        run: |
          # 보강이 시간에 잘렸어도 체크포인트가 남는다 — 부분본 > 빈손.
          if [ ! -s enriched.json ]; then
            echo '보강본이 없다(시작 전에 죽음) — 커밋할 것 없음.'
            exit 0
          fi
          cp enriched.json site/spa/public/data/preemption-board.json
          cd site
          git config user.name 'leword-bot'
          git config user.email 'bot@leaderspro.kr'
          git add spa/public/data/preemption-board.json
          if git diff --cached --quiet; then
            echo '보강으로 바뀐 것이 없다.'
            exit 0
          fi
          git commit -m "chore(board): 에이전트 보강 $(date -u '+%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push
