name: 선점 보드 발굴 (월·금)

# 매일 돌리지 않는다 — 사장님 지시.
#
# 시간대 함정: cron 은 UTC 다. 한국 월요일 07:00 은 UTC 일요일 22:00,
# 금요일 07:00 은 UTC 목요일 22:00 이다. 그래서 요일이 0(일)·4(목) 이다.
# 여기에 1,5 를 적으면 한국 시간으로 화요일·토요일에 돈다.
on:
  schedule:
    - cron: '0 22 * * 0,4'
  workflow_dispatch:
    inputs:
      targetPerTopic:
        description: 주제당 목표 건수
        default: '4'
      # 씨앗 창고만 다시 긁고 끝낸다 — BD 크레딧을 안 쓴다(무료 호출 200여 회).
      # 힌트 창구(2026-09-08)의 실제 응답을 감사하려고 만들었다. 로컬엔 검색광고
      # 키가 없고, 회차를 통째로 돌리면 돈이 나간다. 로그의 순위 구간 표본을 읽는다.
      seedsOnly:
        description: 씨앗 창고만 다시 긁고 끝낸다 (BD 안 씀)
        default: 'false'

concurrency:
  group: preemption-board
  cancel-in-progress: false

# ─────────────────────────────────────────────────────────────────────────────
# 【극한 공급 개편 2026-09-07】사장님 지시: "최대한 극한으로 끌어올려.
# 예산 정했으면 전부 써. 발굴 게이트도 최대한 풀고… 더 가능한 작업은 전부 동원해.
# 이 황금키워드가 많아야 메리트가 있는 거니까."
#
# 첫 32주제 회차(34095577375) 실측이 병목을 뒤집었다 — BD 가 아니었다.
#
#   npm ci            4분 53초
#   발굴 단계       2시간 56분   ← 자동완성 10,608회가 그중 2시간 49분
#   BD 판정          37분 23초   ← 예산 1,920콜 중 736콜만 씀 (62% 미사용)
#   에이전트 보강     32분 03초
#   ─────────────────────────
#   회차 전체       4시간 11분   (잡 제한 300분 — 남은 여유 49분)
#
# 진짜 병목은 표본이었다. 자동완성이 만든 문장은 197,889개인데 검색량을 재 본
# 것은 19,200개(9.7%)뿐이다. sampleCap 기본값이 perTopic×20 이라 주제당 600개에서
# 끊겼기 때문이다. 주제별로 보면 더 선명하다:
#
#   문학·책   완결 13,571 → 표본 600(4.4%) → 수요통과 62 → 후보 14
#   일상·생각 완결 17,298 → 표본 600(3.5%) → 수요통과 78 → 후보 14
#   반려동물  완결 12,086 → 표본 600(5.0%) → 수요통과 60 → 후보  6
#
# 즉 2시간 49분을 들여 만든 문장의 90%를 **쳐다보지도 않고 버리고 있었다.**
#
# 그런데 한 잡에서 표본만 늘리면 300분 제한에 걸려 회차가 통째로 0행이 된다.
# 그래서 잡을 셋으로 나눈다 — 발굴을 러너 4대에 흩고, 합치기·BD·발행은 한 곳에서
# 한다. 러너당 IP 요청 속도는 그대로라 네이버에 더 세게 두드리지 않는다.
# 벽시계만 1/4 이 된다.
#
#   seeds    씨앗 창고 1회 (샤드 4개가 각자 만들면 같은 152콜을 4번 쓴다)
#   discover 샤드 4개 병렬 — 주제는 라운드로빈으로 나뉜다(무거운 주제 쏠림 방지)
#   publish  합치기 → 절단 → BD → 보강 → 발행 → 장부 (예산·장부는 단일 기록자)
#
# 주제 목록은 discover 의 --topics= 한 곳에만 적는다. 매트릭스에 흩어 적으면
# 발행의 ACTIVE_TOPICS 와 대조할 수가 없다(preemption-board-workflow.test.ts).
# 샤드 분배는 스크립트가 한다(--shard/--shards, candidate-shards.js).
# ─────────────────────────────────────────────────────────────────────────────

jobs:
  # ── 1) 씨앗 창고 ────────────────────────────────────────────────────────────
  # 검색광고가 공식으로 내주는 month·event·biztpId 를 긁어 둔다(실측 44,344개).
  # 3일 안쪽이면 스스로 건너뛴다. 샤드마다 돌리면 같은 152콜을 4번 쓰므로 여기서
  # 한 번만 만들고 아티팩트로 넘긴다.
  #
  # 실패해도 회차는 살린다 — 창고가 없거나 낡아도 발굴은 기존 씨앗(상시·계절)으로
  # 그대로 돈다. 그래서 아래 discover 는 이 잡의 성패를 기다리지 않는다.
  seeds:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: npm ci (행업 방어)
        run: |
          for i in 1 2 3; do
            timeout 600 npm ci && exit 0
            echo "npm ci 실패 또는 10분 초과 — 재시도 $i/3"
          done
          exit 1

      - name: 씨앗 창고 갱신
        continue-on-error: true
        env:
          NAVER_SEARCH_AD_ACCESS_LICENSE: ${{ secrets.NAVER_SEARCH_AD_ACCESS_LICENSE }}
          NAVER_SEARCH_AD_SECRET_KEY: ${{ secrets.NAVER_SEARCH_AD_SECRET_KEY }}
          NAVER_SEARCH_AD_CUSTOMER_ID: ${{ secrets.NAVER_SEARCH_AD_CUSTOMER_ID }}
          # seedsOnly 감사 실행은 강제로 다시 긁는다 — 레포 창고가 3일 안쪽이면
          # 스크립트가 "그대로 씁니다" 하고 끝나 버려서 볼 것이 없다.
          FORCE_REBUILD: ${{ github.event.inputs.seedsOnly == 'true' }}
        run: node scripts/build-seed-db.js $([ "$FORCE_REBUILD" = 'true' ] && echo --force)

      - name: 씨앗 창고 넘기기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seed-db
          path: data/seed-db.json
          retention-days: 7
          if-no-files-found: warn

  # ── 2) 후보 발굴 (샤드 4개 병렬) ─────────────────────────────────────────────
  discover:
    needs: seeds
    # 씨앗 창고가 실패해도 발굴은 돈다(상시·계절 씨앗만으로도 판다).
    # seedsOnly 감사 실행이면 여기서 멈춘다 — 무료 API 도 태우지 않는다.
    if: ${{ always() && github.event.inputs.seedsOnly != 'true' }}
    runs-on: ubuntu-latest
    # 샤드 하나는 8주제라 실측 기준 100분 안쪽이다. 여유를 두고 240분.
    timeout-minutes: 240
    strategy:
      # 한 샤드가 죽어도 나머지 셋은 끝까지 판다. 합치기가 빠진 샤드를 건너뛴다.
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # npm ci 가 하루 두 번 러너에서 걸렸다(2시간 행업 1회, 러너 사망 1회) —
      # 레지스트리·러너 플레이크다. 10분 제한 + 3회 재시도로 회차를 지킨다.
      - name: npm ci (행업 방어)
        run: |
          for i in 1 2 3; do
            timeout 600 npm ci && exit 0
            echo "npm ci 실패 또는 10분 초과 — 재시도 $i/3"
          done
          exit 1

      # 돈 쓰기 전에 끝까지 갈 수 있는지부터 본다.
      #
      # 발행용 토큰이 없으면 BD 크레딧을 다 태우고 나서 마지막 스텝에서 죽는다.
      # 그 회차의 결과는 아티팩트에도 안 남고 사라진다 — 순수 손실이다.
      # 그래서 무료 단계보다도 앞에 세운다.
      - name: 필수 시크릿 확인
        env:
          REQUIRED: |
            NAVER_SEARCH_AD_ACCESS_LICENSE=${{ secrets.NAVER_SEARCH_AD_ACCESS_LICENSE != '' }}
            NAVER_SEARCH_AD_SECRET_KEY=${{ secrets.NAVER_SEARCH_AD_SECRET_KEY != '' }}
            NAVER_SEARCH_AD_CUSTOMER_ID=${{ secrets.NAVER_SEARCH_AD_CUSTOMER_ID != '' }}
            NAVER_CLIENT_ID=${{ secrets.NAVER_CLIENT_ID != '' }}
            NAVER_CLIENT_SECRET=${{ secrets.NAVER_CLIENT_SECRET != '' }}
            BRIGHTDATA_TOKEN=${{ secrets.BRIGHTDATA_TOKEN != '' }}
            SITE_REPO_SSH_KEY=${{ secrets.SITE_REPO_SSH_KEY != '' }}
        run: |
          missing=0
          while IFS='=' read -r name present; do
            [ -z "$name" ] && continue
            if [ "$present" != 'true' ]; then
              echo "::error::시크릿 없음 — $name"
              missing=1
            fi
          done <<< "$REQUIRED"
          if [ "$missing" -eq 1 ]; then
            echo '크레딧을 쓰기 전에 멈춘다. 저장소 Settings → Secrets 에서 채울 것.'
            exit 1
          fi
          echo '필수 시크릿 확인됨.'

      # 씨앗 창고를 받아 온다. 없으면 레포에 커밋된 지난 회차 것을 그대로 쓴다.
      - name: 씨앗 창고 받기
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: seed-db
          path: data

      # 실시간 검색어 스냅샷. 무료이고, BD 를 태우기 전에 뜬다.
      #
      # 이게 없으면 실시간 집합이 비어서 `inRealtimeNow` 가 전 행 false 가 되고,
      # 화면에는 "실시간 검색어에는 아직 없다 — 대중화 전이다" 가 **재보지도 않은 채**
      # 근거로 붙는다(2026-08-11 확인). 공급원은 네이버 하나다 — 보드가 판정하는
      # 자리가 네이버 자리이기 때문이다.
      #
      # 실패하면 파일을 안 남긴다. 그러면 아래 단계가 '못 쟀음'(null)으로 다뤄
      # 근거에서 뺀다 — 회차를 죽이지는 않는다.
      - name: 실시간 검색어 스냅샷
        continue-on-error: true
        run: node scripts/realtime-signals.js --out=signals.json --limit=20

      # 후보 발굴은 무료다(검색광고·자동완성). BD 크레딧은 발행 잡에서만 쓴다.
      - name: 후보 발굴
        env:
          # SEARCH 와 AD 사이 밑줄을 빼면 조용히 빈 값이 된다. EnvironmentManager 가
          # 읽는 이름은 여기 적힌 그대로이고, 어긋나면 예외 없이 빈 문자열이 되어
          # "자격증명이 필요합니다" 로 죽는다 — 실측으로 확인했다.
          # preemption-board-workflow.test.ts 가 이 이름들을 코드와 대조한다.
          NAVER_SEARCH_AD_ACCESS_LICENSE: ${{ secrets.NAVER_SEARCH_AD_ACCESS_LICENSE }}
          NAVER_SEARCH_AD_SECRET_KEY: ${{ secrets.NAVER_SEARCH_AD_SECRET_KEY }}
          NAVER_SEARCH_AD_CUSTOMER_ID: ${{ secrets.NAVER_SEARCH_AD_CUSTOMER_ID }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          # API HUB 시크릿 등록 전엔 빈 값 → 어댑터가 legacy 로 동작(무해)
          NAVER_APIHUB_KEY_ID: ${{ secrets.NAVER_APIHUB_KEY_ID }}
          NAVER_APIHUB_KEY: ${{ secrets.NAVER_APIHUB_KEY }}
        # 【32주제 전면 개방 2026-09-07】사장님 지시: "모든 주제를 다 열어놔.
        # 어떤 키워드를 원하는지 모르잖아 사용자들은."
        #
        # 이 보드는 사장님만 보는 것이 아니라 **사용자들이 자기 주제를 골라 보는 판**
        # 이다. 어느 주제를 원할지 모르니 32종을 전부 훑어 놓고 고르게 한다
        # (blog-topic-coverage 의 원래 설계 그대로다). 씨앗은 준비돼 있다 —
        # 상시 331개(32주제 전부 5개 이상) + 계절 표 + 창고 44,344개.
        #
        # 주제 목록은 발행의 ACTIVE_TOPICS 와 같아야 한다 — 여기만 늘리면 발굴은
        # 되는데 발행 게이트가 걸러 내고, 저기만 늘리면 실릴 행이 아예 안 생긴다.
        # preemption-board-workflow.test.ts 가 두 곳을 대조한다.
        #
        # 【인자 상향 2026-09-07 극한 공급】
        #
        # sampleCap=4000 (기본 perTopic×20 에서 떼어 낸다) — 이번 개편의 핵심이다.
        #   주제당 600개만 재던 것을 4,000개로. 수요통과가 주제당 60~110 → 300 안팎이
        #   되고, 게이트 통과율 17%(실측 368/2,129)를 곱하면 주제당 50건 안팎이 남는다.
        #   검색량 조회는 무료이고 5개씩 묶여 나간다.
        #
        # perTopic=80 — measured.length >= perTopic 에서 측정 루프가 **멈춘다**.
        #   즉 perTopic 은 정원이 아니라 후보 수 상한 그 자체다. 30 으로 두면 표본을
        #   아무리 늘려도 주제당 30건에서 잘린다. 80 이면 문서수 조회가 주제당
        #   300~470회라 오픈 API 일일 한도(25,000) 안이다.
        #
        # scanWidth=100 — 측정 대상이 perTopic×scanWidth 라 정원만 올리면 안 따라온다.
        #
        # starvedFloor=15 — 굶은 주제 판정선. 직전 보드 기준이라, 목표를 주제당
        #   30~50행으로 올린 이상 15행 미만은 굶은 것으로 봐야 한다.
        # starvedFacing=6 — 굶은 주제에서만 '정면 글 6건 이상'일 때 SERP 전에 버린다
        #   (배부른 주제는 기본 2건 그대로 — 다 풀면 쓰레기가 는다).
        run: |
          node scripts/preemption-candidates.js \
            --topics=문학·책,영화,미술·디자인,공연·전시,음악,드라마,스타·연예인,만화·애니,방송,일상·생각,육아·결혼,반려동물,좋은글·이미지,패션·미용,인테리어·DIY,요리·레시피,상품리뷰,원예·재배,게임,스포츠,사진,자동차,취미,국내여행,세계여행,맛집,IT·컴퓨터,사회·정치,건강·의학,비즈니스·경제,어학·외국어,교육·학문 \
            --shard=${{ matrix.shard }} --shards=4 \
            --out=candidates-shard-${{ matrix.shard }}.json \
            --perTopic=80 --perSeed=10 --sampleCap=4000 --scanWidth=100 --secondarySeeds=40 \
            --targetTotal=2560 --promotedPerTopic=30 \
            --starvedFloor=15 --starvedFacing=6 \
            --board=https://raw.githubusercontent.com/cd000242-sudo/naver/main/spa/public/data/preemption-board.json \
            --signals=signals.json

      - name: 샤드 결과 넘기기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidates-shard-${{ matrix.shard }}
          path: candidates-shard-${{ matrix.shard }}.json
          retention-days: 14
          if-no-files-found: warn

  # ── 3) 합치기 → 절단 → BD → 보강 → 발행 ────────────────────────────────────
  # 예산 장부와 최초 관측 장부는 여기 한 곳에서만 쓴다. 샤드가 각자 쓰면
  # 마지막에 커밋한 샤드가 나머지를 덮어써서 상한이 작동하지 않는다.
  publish:
    needs: discover
    # 샤드 일부가 죽어도 살아남은 것으로 발행한다 — "부분 보드 > 빈손" 방침.
    # 전멸이면 합치기가 던져서 회차가 빨간불로 남는다(조용한 0행 발행 방지).
    # seedsOnly 면 발굴이 건너뛰어 샤드가 없다 — always() 만 두면 여기가 빈손으로
    # 돌아 합치기에서 죽으므로 같은 조건으로 함께 멈춘다.
    if: ${{ always() && github.event.inputs.seedsOnly != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    # 최초 관측 장부를 이 레포에 되돌려 커밋하기 위해 필요하다(아래 마지막 스텝).
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: npm ci (행업 방어)
        run: |
          for i in 1 2 3; do
            timeout 600 npm ci && exit 0
            echo "npm ci 실패 또는 10분 초과 — 재시도 $i/3"
          done
          exit 1

      - name: 샤드 결과 받기
        uses: actions/download-artifact@v4
        with:
          pattern: candidates-shard-*
          path: shards
          merge-multiple: true

      # 씨앗 창고를 받아 마지막 스텝에서 레포로 되돌려 커밋한다.
      # 다음 회차가 이 파일을 읽어 3일 안쪽이면 갱신을 건너뛴다.
      - name: 씨앗 창고 받기
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: seed-db
          path: data

      # BD 판정이 실시간 집합을 쓴다. 발굴 잡의 스냅샷은 그 잡 안에만 있다.
      - name: 실시간 검색어 스냅샷
        continue-on-error: true
        run: node scripts/realtime-signals.js --out=signals.json --limit=20

      - name: 샤드 합치기
        run: node scripts/candidate-shards.js --out=candidates.json --expect=4 shards/candidates-shard-*.json

      # 예산 절단 — 뽑은 만큼 그대로 넘기면 크레딧을 넘긴다(한 번 겪었다).
      #
      # keep 은 주제당 정원이다. 실제 총량 상한은 아래 거버너와 maxPerRun 이 정한다.
      # 첫 32주제 회차에서 이 절단은 **한 건도 자르지 않았다**(후보 368 → 368) —
      # 발굴이 주제당 30 을 못 채웠기 때문이다. 이제 표본을 6.7배로 늘렸으니
      # 여기가 30 이면 늘린 만큼이 도로 잘린다. perTopic 과 같은 80 으로 맞춘다.
      # boostKeep: 굶은 주제(발굴기가 파일에 실어 보낸다)만 100건까지 남긴다.
      - name: 예산에 맞춰 자르기
        run: node scripts/trim-candidates.js --in=candidates.json --out=candidates-trimmed.json --keep=80 --boostKeep=100

      - name: 자리 판정 (Bright Data)
        env:
          BRIGHTDATA_TOKEN: ${{ secrets.BRIGHTDATA_TOKEN }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
          # 쿼터 장부를 레포 파일로 고정한다.
          #
          # 기본 경로가 os.tmpdir() 이라 CI 는 회차마다 장부를 잃었다. 그래서 월
          # 상한이 여기서 한 번도 작동한 적이 없다(2026-08-22 확인) — 매 회차가
          # 사용량 0 에서 시작했다. 최초 관측 장부와 같은 방식으로 되돌려 커밋한다.
          LEWORD_BRIGHTDATA_QUOTA_STATE_FILE: ${{ github.workspace }}/data/brightdata-quota-state.json
          # 무료 5,000 을 넘겨 허용할 유료 초과분.
          #
          # 사장님 한도: "10달러까지 상한을 늘려 사용 가능하니까 걱정하지 말고,
          # 10달러가 부족하다면 20달러까지도 가능해"(2026-08-23) ·
          # "20달러만 안 넘으면 된다"(2026-09-07).
          #
          #   11,000 콜 × $1.50/1,000 = 최대 $16.50 — 20달러 한도 안이다.
          # 회차당 실제 소모는 maxPerRun 이 정한다(2,400콜). 월 8회차면 19,200콜이라
          # 무료 5,000 을 뺀 14,200콜이 유료로 나갈 수 있는데, 상한 11,000 이
          # 먼저 걸려 $16.50 에서 멈춘다 — 즉 한도를 넘길 수 없는 구조다.
          # 위 장부가 살아 있어야 이 숫자가 상한 구실을 한다. 순서를 바꾸지 말 것.
          LEWORD_BRIGHTDATA_PAID_OVERAGE: '11000'
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          NAVER_APIHUB_KEY_ID: ${{ secrets.NAVER_APIHUB_KEY_ID }}
          NAVER_APIHUB_KEY: ${{ secrets.NAVER_APIHUB_KEY }}
        # maxPerRun 1,920 → 2,400: 발굴이 늘어난 만큼 태울 수 있는 자리도 늘린다.
        # 실제로는 위 PAID_OVERAGE(11,000) 가 월 상한으로 먼저 걸린다.
        run: |
          node scripts/preemption-board-batch.js \
            --in=candidates-trimmed.json \
            --out=board.json \
            --targetPerTopic=${{ github.event.inputs.targetPerTopic || '4' }} \
            --signals=signals.json \
            --maxPerRun=2400 \
            --withStructure

      # 에이전트 보강 — 회차마다 두뇌가 개입한다(사장님 지시: "하나하나 에이전트가").
      #
      # 클로드(구독 OAuth)가 행마다 문제해결 서브를 제안하고, 실존 결재(검색량>0
      # 또는 자동완성 프로브)를 통과한 것만 싣는다. 제목도 그 파생+SERP 상위
      # 10개 실측으로 다시 조립한다. 첫 수동 회차 실측(서브 0/24행·제목 전부
      # generic)이 이 스텝의 존재 이유다.
      #
      # continue-on-error: 보강이 죽어도 회차는 발행한다 — 밋밋한 보드 > 빈손.
      # 토큰이 없으면 스스로 건너뛴다(크레딧·시간 낭비 방지).
      - name: 에이전트 보강 (클로드 구독)
        if: always()
        continue-on-error: true
        # 스텝 제한: 잘려도 체크포인트(행마다 저장)가 남아 아래 반영 스텝이 줍는다.
        timeout-minutes: 150
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          NAVER_SEARCH_AD_ACCESS_LICENSE: ${{ secrets.NAVER_SEARCH_AD_ACCESS_LICENSE }}
          NAVER_SEARCH_AD_SECRET_KEY: ${{ secrets.NAVER_SEARCH_AD_SECRET_KEY }}
          NAVER_SEARCH_AD_CUSTOMER_ID: ${{ secrets.NAVER_SEARCH_AD_CUSTOMER_ID }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          NAVER_APIHUB_KEY_ID: ${{ secrets.NAVER_APIHUB_KEY_ID }}
          NAVER_APIHUB_KEY: ${{ secrets.NAVER_APIHUB_KEY }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo '구독 토큰 없음 — 보강을 건너뛴다(규칙+실측 보드 그대로 발행).'
            exit 0
          fi
          npm install -g @anthropic-ai/claude-code
          # 상한은 사고 방지용이지 절약 수단이 아니다(구독 호출이라 건당 비용 없음).
          # maxAi 150→260: 행 3개 동시 처리(행당 33초)면 260행이 약 48분이라
          # 스텝 제한(150분) 안이다. 발굴이 늘어난 만큼 보강도 따라 올린다.
          node scripts/enrich-board.js --in=board.json --out=board-enriched.json --maxAi=260

      # 보강이 시간에 잘렸어도 체크포인트(행마다 저장)를 줍는다 — 부분본 > 빈손.
      # 같은 스텝 안에 mv 를 두면 스텝이 죽는 순간 반영도 같이 죽는다(실측).
      - name: 보강본 반영
        if: always()
        run: |
          if [ -s board-enriched.json ]; then mv board-enriched.json board.json; echo '보강본 반영됨.'; else echo '보강본 없음 — 규칙 보드 그대로.'; fi

      # 원장을 아티팩트로 남긴다.
      #
      # 탈락 사유(rejections)는 board.json 안에만 있고 사이트에는 안 나간다. 그래서
      # 회차가 끝나고 나면 "무엇이 왜 떨어졌는지" 를 되짚을 방법이 없다 —
      # 게이트를 조일지 풀지 정할 근거가 매번 사라진다는 뜻이다.
      # 2026-08-11 회차가 딱 그렇게 됐다: 통과 12/56 인데 이유를 못 봤다.
      #
      # if: always() 로 둔다. 잘렸을 때야말로 남은 것을 봐야 한다.
      - name: 보드 원장 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preemption-board-raw
          path: |
            board.json
            candidates.json
            candidates-trimmed.json
            signals.json
          retention-days: 14
          if-no-files-found: warn

      # 사이트 레포에 발행한다. 화면이 읽는 파일은 그쪽에 있다.
      #
      # 개인 토큰(PAT) 대신 배포키를 쓴다. 개인 토큰은 계정의 모든 레포에 대한
      # 권한을 CI 로그 안까지 들고 들어오고, 사람이 재로그인하면 조용히 깨진다.
      # 배포키는 이 레포 하나에만 붙고 만료가 없다.
      - name: 사이트 레포 체크아웃
        if: always()
        uses: actions/checkout@v4
        with:
          repository: cd000242-sudo/naver
          ssh-key: ${{ secrets.SITE_REPO_SSH_KEY }}
          path: site

      # 배치가 도중에 죽어도(체크포인트 덕에 board.json 은 남는다) 있는 만큼 발행한다.
      # 사장님 방침: "조금 미달되더라도 참고할 수 있다면 상관없다." 부분 보드 > 빈손.
      - name: 보드 발행
        if: always()
        # 시계열이 아예 없는 행을 여기서 채운다(2026-09-07). 이월 행은 보강 단계를
        # 안 거치므로 발행이 유일한 자리다(실측 5행). 키가 없으면 채우지 않고 넘어간다.
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: |
          node scripts/publish-preemption-board.js \
            --in=board.json \
            --dest=site/spa/public/data/preemption-board.json

      - name: 커밋·푸시
        if: always()
        working-directory: site
        run: |
          git config user.name 'leword-bot'
          git config user.email 'bot@leaderspro.kr'
          git add spa/public/data/preemption-board.json
          # 통과 행이 없으면 발행기가 기존 파일을 그대로 두므로 변경이 없다.
          if git diff --cached --quiet; then
            echo '변경 없음 — 이번 회차는 통과한 키워드가 없다.'
            exit 0
          fi
          git commit -m "chore(board): 선점 보드 갱신 $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push

      # 최초 관측 장부를 이 레포에 되돌려 커밋한다.
      #
      # 이게 없으면 CI 는 매 회차 **빈 장부**로 시작한다. 그러면 모든 키워드가
      # "이번에 처음 등록" 이 되고, 배치는 그런 것을 나이 모름(null)으로 넘긴다
      # (지금 시각을 나이로 읽으면 몇 년 된 말에도 '0시간 전'이 붙기 때문이다).
      # 결과는 '선점 적기' 가 매 회차 0행 — 장부가 쌓이지 않아서지 밭이 없어서가 아니다.
      #
      # 장부는 키워드와 최초 관측 시각뿐이고 비밀이 없다. 실패해도 회차는 살린다 —
      # 이 스텝 때문에 이미 태운 BD 크레딧의 결과를 버릴 이유가 없다.
      # 잘려도 장부는 남긴다. 배치가 BD 를 태우기 전에 장부를 먼저 쓰므로,
      # 앞 스텝이 취소돼도 이번 회차에 관측한 것은 기록된다.
      - name: 최초 관측 장부 커밋
        if: always()
        continue-on-error: true
        run: |
          git config user.name 'leword-bot'
          git config user.email 'bot@leaderspro.kr'
          # 씨앗 창고도 함께 — 다음 회차가 이 파일을 읽어 씨앗을 고른다.
          # 갱신 스텝이 건너뛰었으면 변경이 없어 아래 diff 검사에서 걸러진다.
          git add data/preemption-first-seen.json data/brightdata-quota-state.json data/seed-db.json
          if git diff --cached --quiet; then
            echo '장부 변경 없음.'
            exit 0
          fi
          git commit -m "chore(board): 최초 관측 장부 갱신 $(date -u '+%Y-%m-%d %H:%M UTC')"
          # 그사이 사람이 밀어 넣은 커밋 위로 얹는다. 장부 파일만 건드리므로 충돌이 없다.
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
