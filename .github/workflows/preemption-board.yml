name: 선점 보드 발굴 (월·금)

# 매일 돌리지 않는다 — 사장님 지시.
#
# 시간대 함정: cron 은 UTC 다. 한국 월요일 07:00 은 UTC 일요일 22:00,
# 금요일 07:00 은 UTC 목요일 22:00 이다. 그래서 요일이 0(일)·4(목) 이다.
# 여기에 1,5 를 적으면 한국 시간으로 화요일·토요일에 돈다.
on:
  schedule:
    - cron: '0 22 * * 0,4'
  workflow_dispatch:
    inputs:
      targetPerTopic:
        description: 주제당 목표 건수
        default: '4'

concurrency:
  group: preemption-board
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    # 90분이면 모자란다 — 2026-08-11 회차가 정확히 90분에 잘렸다.
    # 실측 배분: 후보 발굴 63분(무료 API 구간) + Bright Data 27분에 29주제 중 14주제.
    # 전 주제를 도려면 BD 만 60분쯤 필요하다. 여유를 두고 3시간으로 둔다.
    timeout-minutes: 300
    # 최초 관측 장부를 이 레포에 되돌려 커밋하기 위해 필요하다(아래 마지막 스텝).
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # npm ci 가 하루 두 번 러너에서 걸렸다(2시간 행업 1회, 러너 사망 1회) —
      # 레지스트리·러너 플레이크다. 10분 제한 + 3회 재시도로 회차를 지킨다.
      - name: npm ci (행업 방어)
        run: |
          for i in 1 2 3; do
            timeout 600 npm ci && exit 0
            echo "npm ci 실패 또는 10분 초과 — 재시도 $i/3"
          done
          exit 1

      # 돈 쓰기 전에 끝까지 갈 수 있는지부터 본다.
      #
      # 발행용 토큰이 없으면 BD 크레딧을 다 태우고 나서 마지막 스텝에서 죽는다.
      # 그 회차의 결과는 아티팩트에도 안 남고 사라진다 — 순수 손실이다.
      # 그래서 무료 단계보다도 앞에 세운다.
      - name: 필수 시크릿 확인
        env:
          REQUIRED: |
            NAVER_SEARCH_AD_ACCESS_LICENSE=${{ secrets.NAVER_SEARCH_AD_ACCESS_LICENSE != '' }}
            NAVER_SEARCH_AD_SECRET_KEY=${{ secrets.NAVER_SEARCH_AD_SECRET_KEY != '' }}
            NAVER_SEARCH_AD_CUSTOMER_ID=${{ secrets.NAVER_SEARCH_AD_CUSTOMER_ID != '' }}
            NAVER_CLIENT_ID=${{ secrets.NAVER_CLIENT_ID != '' }}
            NAVER_CLIENT_SECRET=${{ secrets.NAVER_CLIENT_SECRET != '' }}
            BRIGHTDATA_TOKEN=${{ secrets.BRIGHTDATA_TOKEN != '' }}
            SITE_REPO_SSH_KEY=${{ secrets.SITE_REPO_SSH_KEY != '' }}
        run: |
          missing=0
          while IFS='=' read -r name present; do
            [ -z "$name" ] && continue
            if [ "$present" != 'true' ]; then
              echo "::error::시크릿 없음 — $name"
              missing=1
            fi
          done <<< "$REQUIRED"
          if [ "$missing" -eq 1 ]; then
            echo '크레딧을 쓰기 전에 멈춘다. 저장소 Settings → Secrets 에서 채울 것.'
            exit 1
          fi
          echo '필수 시크릿 확인됨.'

      # 실시간 검색어 스냅샷. 무료이고, BD 를 태우기 전에 뜬다.
      #
      # 이게 없으면 아래 두 스텝의 실시간 집합이 비어서 `inRealtimeNow` 가 전 행
      # false 가 되고, 화면에는 "실시간 검색어에는 아직 없다 — 대중화 전이다" 가
      # **재보지도 않은 채** 근거로 붙는다(2026-08-11 확인). 공급원은 네이버 하나다 —
      # 보드가 판정하는 자리가 네이버 자리이기 때문이다.
      #
      # 실패하면 파일을 안 남긴다. 그러면 아래 단계가 '못 쟀음'(null)으로 다뤄
      # 근거에서 뺀다 — 회차를 죽이지는 않는다.
      - name: 실시간 검색어 스냅샷
        continue-on-error: true
        run: node scripts/realtime-signals.js --out=signals.json --limit=20

      # 후보 발굴은 무료다(검색광고·자동완성). BD 크레딧은 다음 단계에서만 쓴다.
      - name: 후보 발굴
        env:
          # SEARCH 와 AD 사이 밑줄을 빼면 조용히 빈 값이 된다. EnvironmentManager 가
          # 읽는 이름은 여기 적힌 그대로이고, 어긋나면 예외 없이 빈 문자열이 되어
          # "자격증명이 필요합니다" 로 죽는다 — 실측으로 확인했다.
          # preemption-board-workflow.test.ts 가 이 이름들을 코드와 대조한다.
          NAVER_SEARCH_AD_ACCESS_LICENSE: ${{ secrets.NAVER_SEARCH_AD_ACCESS_LICENSE }}
          NAVER_SEARCH_AD_SECRET_KEY: ${{ secrets.NAVER_SEARCH_AD_SECRET_KEY }}
          NAVER_SEARCH_AD_CUSTOMER_ID: ${{ secrets.NAVER_SEARCH_AD_CUSTOMER_ID }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          # API HUB 시크릿 등록 전엔 빈 값 → 어댑터가 legacy 로 동작(무해)
          NAVER_APIHUB_KEY_ID: ${{ secrets.NAVER_APIHUB_KEY_ID }}
          NAVER_APIHUB_KEY: ${{ secrets.NAVER_APIHUB_KEY }}
        # perTopic 은 표본 폭(perTopic × 12)도 같이 정한다. 6 이면 주제당 72개만
        # 재고 끝나서 후보가 얕다. 10 으로 두면 120개를 재고, 그중 좋은 6개를
        # 다음 스텝이 고른다 — BD 비용은 그대로다(자르는 개수가 예산을 정한다).
        # 초대량 공급(2026-08-18, 사장님 지시 "씨앗공급 초대대량"): 정원·스캔폭 상향
        # + 스필오버(정원 밀림 전량 순위 승격) + 승격 큐(직전 보드 실측 풀 되먹임).
        # 후보가 많아도 BD 예산 거버너가 앞순위부터 태우다 한도에서 멈춘다.
        run: node scripts/preemption-candidates.js --all --out=candidates.json --perTopic=30 --perSeed=10 --scanWidth=60 --secondarySeeds=30 --targetTotal=500 --promotedPerTopic=20 --board=https://raw.githubusercontent.com/cd000242-sudo/naver/main/spa/public/data/preemption-board.json --signals=signals.json

      # 예산 절단 — 뽑은 만큼 그대로 넘기면 크레딧을 넘긴다(한 번 겪었다).
      - name: 예산에 맞춰 자르기
        # keep 6 → 9 (2026-08-18): 회당 상한 520콜 상향에 맞춘 공급 확대.
        # 사장님 목표 보드 100행 — 통과율 40% 실측 기준 검증 ~250건이 필요하다.
        # keep 9→20: 초대량 공급에 맞춰 주제당 정원 확대. 총량은 BD 거버너가 지킨다.
        run: node scripts/trim-candidates.js --in=candidates.json --out=candidates-trimmed.json --keep=20

      - name: 자리 판정 (Bright Data)
        env:
          BRIGHTDATA_TOKEN: ${{ secrets.BRIGHTDATA_TOKEN }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
          # 쿼터 장부를 레포 파일로 고정한다.
          #
          # 기본 경로가 os.tmpdir() 이라 CI 는 회차마다 장부를 잃었다. 그래서 월
          # 상한이 여기서 한 번도 작동한 적이 없다(2026-08-22 확인) — 매 회차가
          # 사용량 0 에서 시작했다. 최초 관측 장부와 같은 방식으로 되돌려 커밋한다.
          LEWORD_BRIGHTDATA_QUOTA_STATE_FILE: ${{ github.workspace }}/data/brightdata-quota-state.json
          # 무료 5,000 을 넘겨 허용할 유료 초과분. 사장님 승인 2026-08-22
          # ("유료 소액이면 월 5000 에 10달러까지 한도잖아").
          # 3,000 콜 × $1.50/1,000 = 최대 $4.50 — 한도의 절반 아래로 잡는다.
          # 위 장부가 살아 있어야 이 숫자가 상한 구실을 한다. 순서를 바꾸지 말 것.
          LEWORD_BRIGHTDATA_PAID_OVERAGE: '3000'
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          NAVER_APIHUB_KEY_ID: ${{ secrets.NAVER_APIHUB_KEY_ID }}
          NAVER_APIHUB_KEY: ${{ secrets.NAVER_APIHUB_KEY }}
        run: |
          node scripts/preemption-board-batch.js \
            --in=candidates-trimmed.json \
            --out=board.json \
            --targetPerTopic=${{ github.event.inputs.targetPerTopic || '4' }} \
            --signals=signals.json \
            --withStructure

      # 에이전트 보강 — 회차마다 두뇌가 개입한다(사장님 지시: "하나하나 에이전트가").
      #
      # 클로드(구독 OAuth)가 행마다 문제해결 서브를 제안하고, 실존 결재(검색량>0
      # 또는 자동완성 프로브)를 통과한 것만 싣는다. 제목도 그 파생+SERP 상위
      # 10개 실측으로 다시 조립한다. 첫 수동 회차 실측(서브 0/24행·제목 전부
      # generic)이 이 스텝의 존재 이유다.
      #
      # continue-on-error: 보강이 죽어도 회차는 발행한다 — 밋밋한 보드 > 빈손.
      # 토큰이 없으면 스스로 건너뛴다(크레딧·시간 낭비 방지).
      - name: 에이전트 보강 (클로드 구독)
        if: always()
        continue-on-error: true
        # 스텝 제한: 잘려도 체크포인트(행마다 저장)가 남아 아래 반영 스텝이 줍는다.
        timeout-minutes: 150
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          NAVER_SEARCH_AD_ACCESS_LICENSE: ${{ secrets.NAVER_SEARCH_AD_ACCESS_LICENSE }}
          NAVER_SEARCH_AD_SECRET_KEY: ${{ secrets.NAVER_SEARCH_AD_SECRET_KEY }}
          NAVER_SEARCH_AD_CUSTOMER_ID: ${{ secrets.NAVER_SEARCH_AD_CUSTOMER_ID }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          NAVER_APIHUB_KEY_ID: ${{ secrets.NAVER_APIHUB_KEY_ID }}
          NAVER_APIHUB_KEY: ${{ secrets.NAVER_APIHUB_KEY }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo '구독 토큰 없음 — 보강을 건너뛴다(규칙+실측 보드 그대로 발행).'
            exit 0
          fi
          npm install -g @anthropic-ai/claude-code
          # 상한 30 은 보드가 24행이던 시절 값이다. 2026-08-17 회차는 37행이라
          # 7행이 보강 없이 발행됐다("AI 호출 상한 도달"). 구독 호출이라 건당
          # 비용이 없으므로 행 수보다 넉넉하게 둔다 — 상한은 사고 방지용이지
          # 절약 수단이 아니다.
          # maxAi 80→150: 행 3개 동시 처리(행당 33초)로 150행도 약 80분 — 스텝 제한(150분) 안이다.
          node scripts/enrich-board.js --in=board.json --out=board-enriched.json --maxAi=150

      # 보강이 시간에 잘렸어도 체크포인트(행마다 저장)를 줍는다 — 부분본 > 빈손.
      # 같은 스텝 안에 mv 를 두면 스텝이 죽는 순간 반영도 같이 죽는다(실측).
      - name: 보강본 반영
        if: always()
        run: |
          if [ -s board-enriched.json ]; then mv board-enriched.json board.json; echo '보강본 반영됨.'; else echo '보강본 없음 — 규칙 보드 그대로.'; fi

      # 원장을 아티팩트로 남긴다.
      #
      # 탈락 사유(rejections)는 board.json 안에만 있고 사이트에는 안 나간다. 그래서
      # 회차가 끝나고 나면 "무엇이 왜 떨어졌는지" 를 되짚을 방법이 없다 —
      # 게이트를 조일지 풀지 정할 근거가 매번 사라진다는 뜻이다.
      # 2026-08-11 회차가 딱 그렇게 됐다: 통과 12/56 인데 이유를 못 봤다.
      #
      # if: always() 로 둔다. 잘렸을 때야말로 남은 것을 봐야 한다.
      - name: 보드 원장 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preemption-board-raw
          path: |
            board.json
            candidates.json
            candidates-trimmed.json
            signals.json
          retention-days: 14
          if-no-files-found: warn

      # 사이트 레포에 발행한다. 화면이 읽는 파일은 그쪽에 있다.
      #
      # 개인 토큰(PAT) 대신 배포키를 쓴다. 개인 토큰은 계정의 모든 레포에 대한
      # 권한을 CI 로그 안까지 들고 들어오고, 사람이 재로그인하면 조용히 깨진다.
      # 배포키는 이 레포 하나에만 붙고 만료가 없다.
      - name: 사이트 레포 체크아웃
        if: always()
        uses: actions/checkout@v4
        with:
          repository: cd000242-sudo/naver
          ssh-key: ${{ secrets.SITE_REPO_SSH_KEY }}
          path: site

      # 배치가 도중에 죽어도(체크포인트 덕에 board.json 은 남는다) 있는 만큼 발행한다.
      # 사장님 방침: "조금 미달되더라도 참고할 수 있다면 상관없다." 부분 보드 > 빈손.
      - name: 보드 발행
        if: always()
        run: |
          node scripts/publish-preemption-board.js \
            --in=board.json \
            --dest=site/spa/public/data/preemption-board.json

      - name: 커밋·푸시
        if: always()
        working-directory: site
        run: |
          git config user.name 'leword-bot'
          git config user.email 'bot@leaderspro.kr'
          git add spa/public/data/preemption-board.json
          # 통과 행이 없으면 발행기가 기존 파일을 그대로 두므로 변경이 없다.
          if git diff --cached --quiet; then
            echo '변경 없음 — 이번 회차는 통과한 키워드가 없다.'
            exit 0
          fi
          git commit -m "chore(board): 선점 보드 갱신 $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push

      # 최초 관측 장부를 이 레포에 되돌려 커밋한다.
      #
      # 이게 없으면 CI 는 매 회차 **빈 장부**로 시작한다. 그러면 모든 키워드가
      # "이번에 처음 등록" 이 되고, 배치는 그런 것을 나이 모름(null)으로 넘긴다
      # (지금 시각을 나이로 읽으면 몇 년 된 말에도 '0시간 전'이 붙기 때문이다).
      # 결과는 '선점 적기' 가 매 회차 0행 — 장부가 쌓이지 않아서지 밭이 없어서가 아니다.
      #
      # 장부는 키워드와 최초 관측 시각뿐이고 비밀이 없다. 실패해도 회차는 살린다 —
      # 이 스텝 때문에 이미 태운 BD 크레딧의 결과를 버릴 이유가 없다.
      # 잘려도 장부는 남긴다. 배치가 BD 를 태우기 전에 장부를 먼저 쓰므로,
      # 앞 스텝이 취소돼도 이번 회차에 관측한 것은 기록된다.
      - name: 최초 관측 장부 커밋
        if: always()
        continue-on-error: true
        run: |
          git config user.name 'leword-bot'
          git config user.email 'bot@leaderspro.kr'
          git add data/preemption-first-seen.json data/brightdata-quota-state.json
          if git diff --cached --quiet; then
            echo '장부 변경 없음.'
            exit 0
          fi
          git commit -m "chore(board): 최초 관측 장부 갱신 $(date -u '+%Y-%m-%d %H:%M UTC')"
          # 그사이 사람이 밀어 넣은 커밋 위로 얹는다. 장부 파일만 건드리므로 충돌이 없다.
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
